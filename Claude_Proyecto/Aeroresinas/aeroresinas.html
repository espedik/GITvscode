<style>
/* ════════════════════════════════════════════════════════════════════════════
   AERORESINAS — reparación estructural de helicópteros.

   Negocio del papá de Adán. Las réplicas en resina son OTRO negocio, con su
   propia página (../Heliescala/), y las dos son independientes: ninguna
   menciona a la otra. Cada archivo es autónomo y se puede subir a su dominio.

   TODO el texto vive en datos.js; aquí solo están el molde y el CSS. Se separó
   el 2026-09-17, cuando el contenido pasó de 400 a más de 1,500 líneas y buscar
   una frase dentro del HTML era buscar una aguja.

   Material: blanco y transparente. Vidrio (blanco al 72 % con desenfoque) sobre
   un cielo claro con dos auroras y una retícula técnica muy tenue, para que se
   lea como un plano y no como un folleto. Un solo acento azul; el ámbar solo
   para el AOG, que es lo único urgente de la página.

   Todas las fotos son de trabajos reales suyos (fotos/), no de banco.
   Sin backend: el formulario arma un mensaje de WhatsApp.
   ════════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f6; --tinta:#0a1020; --t2:#48536b; --t3:#8994ab;
  --azul:#1b47ff; --cian:#00c2d4; --ambar:#c2410c;
  --linea:rgba(10,16,32,.10); --linea2:rgba(10,16,32,.055);
  --vidrio:rgba(255,255,255,.72); --vidrio2:rgba(255,255,255,.55);
  --luz:rgba(255,255,255,.95);
  --sombra:0 18px 50px -22px rgba(10,16,32,.30);
  --fd:'Space Grotesk','Segoe UI',sans-serif;
  --fb:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --ancho:1280px;
}
html{scroll-behavior:smooth;scroll-padding-top:86px}
body{font-family:var(--fb);background:var(--bg);color:var(--tinta);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
::selection{background:rgba(27,71,255,.16)}
.cielo{position:absolute;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 55% 45% at 12% 0%, rgba(27,71,255,.13) 0%, transparent 62%),
  radial-gradient(ellipse 45% 40% at 88% 4%, rgba(0,194,212,.14) 0%, transparent 62%),
  radial-gradient(ellipse 70% 40% at 50% 100%, rgba(27,71,255,.07) 0%, transparent 66%)}
.malla{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:
  linear-gradient(rgba(10,16,32,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(10,16,32,.045) 1px,transparent 1px);background-size:64px 64px}
section{position:relative}
.wrap{position:relative;z-index:1;width:100%;max-width:var(--ancho);margin:0 auto;padding:0 32px}

/* ── Barra ─────────────────────────────────────────────────────────────── */
.barra{position:sticky;top:0;z-index:40;background:var(--vidrio);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-bottom:1px solid var(--linea);box-shadow:0 1px 0 var(--luz) inset}
.barra-in{display:flex;align-items:center;gap:22px;height:70px;max-width:var(--ancho);margin:0 auto;padding:0 32px}
.marca{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex:none}
.marca i{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--tinta);color:#fff;font-style:normal}
.marca .n{display:flex;flex-direction:column;line-height:1.05}
.marca .n b{font-family:var(--fd);font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.marca .n span{font-family:var(--fm);font-size:8.5px;font-weight:500;letter-spacing:.18em;color:var(--t3);white-space:nowrap}
.menu{display:flex;gap:18px;flex:1;min-width:0}
.menu a{font-size:13.5px;font-weight:500;color:var(--t2);text-decoration:none;white-space:nowrap;transition:color .15s}
.menu a:hover{color:var(--tinta)}
.barra-d{display:flex;align-items:center;gap:10px;flex:none}
.lang{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:11px;
  border:1px solid var(--linea);background:var(--vidrio);color:var(--tinta);cursor:pointer;
  font-family:var(--fb);font-size:13px;font-weight:600;white-space:nowrap;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .15s}
.lang:hover{background:#fff}
.lang svg{flex:none;opacity:.75}

/* ── Botones ───────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 22px;border-radius:13px;
  font-family:var(--fb);font-size:14.5px;font-weight:600;letter-spacing:-.005em;text-decoration:none;
  cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s}
.btn svg{flex:none}
.btn-p{background:var(--azul);color:#fff;border-color:var(--azul);box-shadow:0 10px 26px -10px rgba(27,71,255,.75)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 14px 32px -10px rgba(27,71,255,.85)}
.btn-s{background:var(--vidrio);color:var(--tinta);border-color:var(--linea);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn-s:hover{background:#fff}
.btn-a{background:var(--ambar);color:#fff;border-color:var(--ambar);box-shadow:0 10px 26px -10px rgba(194,65,12,.7)}
.btn-a:hover{transform:translateY(-1px)}
.btn-sm{padding:11px 16px;font-size:13px;border-radius:11px}
.wa-flota{position:fixed;right:16px;bottom:16px;z-index:50;display:none;align-items:center;
  justify-content:center;width:56px;height:56px;border-radius:18px;text-decoration:none;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.5)}

/* ── Texto ─────────────────────────────────────────────────────────────── */
.ojo{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--azul)}
.ojo::before{content:'';width:22px;height:1px;background:currentColor;flex:none}
.h1{font-family:var(--fd);font-size:clamp(33px,4.8vw,56px);font-weight:600;letter-spacing:-.035em;
  line-height:1.05;text-wrap:pretty}
.h1 em{font-style:normal;color:var(--azul)}
.h2{font-family:var(--fd);font-size:clamp(26px,3.4vw,38px);font-weight:600;letter-spacing:-.025em;
  line-height:1.12;max-width:20ch;text-wrap:pretty}
.h3{font-family:var(--fd);font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.sub{font-size:clamp(14.5px,1.35vw,16.5px);line-height:1.65;color:var(--t2);max-width:66ch}
.lead{font-size:15.5px;line-height:1.75;color:var(--t2)}
b,strong{font-weight:600;color:var(--tinta)}
.dato{display:flex;flex-direction:column;gap:5px}
.dato .v{font-family:var(--fd);font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.dato .k{font-family:var(--fm);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.pend{color:var(--azul);background:rgba(27,71,255,.07);border-bottom:1px dashed rgba(27,71,255,.4);
  padding:0 3px;border-radius:3px;font-family:var(--fm);font-size:.92em}

/* ── Secciones ─────────────────────────────────────────────────────────── */
.sec{padding:clamp(48px,6.5vw,76px) 0}
.sec-blanca{background:#fff;border-top:1px solid var(--linea2)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:32px;flex-wrap:wrap}
.sec-n{font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:var(--t3);white-space:nowrap}

/* ── Hero ──────────────────────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:44px;align-items:center;
  padding:clamp(38px,5.5vw,68px) 0 clamp(44px,6vw,60px)}
.hero-txt{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-datos{display:grid;grid-template-columns:repeat(4,auto);gap:26px;padding-top:16px;
  border-top:1px solid var(--linea2);justify-content:start}

/* ── Fotos ─────────────────────────────────────────────────────────────── */
.foto{position:relative;border-radius:18px;overflow:hidden;background:rgba(10,16,32,.05);
  box-shadow:var(--sombra)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .pie{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 13px;color:#fff;font-size:12px;
  line-height:1.5;background:linear-gradient(to top,rgba(6,10,20,.86),transparent)}
.foto .pie b{color:#fff}
.hero-fotos{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}
.hero-fotos .alta{grid-column:1/-1;height:320px}
.hero-fotos .baja{height:178px}

/* ── Servicios ─────────────────────────────────────────────────────────── */
.servs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.serv{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--vidrio);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--linea);box-shadow:0 1px 0 var(--luz) inset,var(--sombra)}
.serv .im{height:180px;background:rgba(10,16,32,.06)}
.serv .im img{width:100%;height:100%;object-fit:cover}
.serv .cuerpo{padding:22px;display:flex;flex-direction:column;gap:11px;flex:1}
.serv-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:rgba(27,71,255,.08);border:1px solid rgba(27,71,255,.18);color:var(--azul)}
.serv .d{font-size:13.5px;line-height:1.62;color:var(--t2)}
.serv .ojo2{font-size:12.5px;line-height:1.6;color:var(--t2);padding:12px 14px;border-radius:11px;
  background:rgba(27,71,255,.05);border:1px solid rgba(27,71,255,.13)}
.serv .ojo2 b{color:var(--tinta)}
.serv .pie2{margin-top:auto;padding-top:12px;border-top:1px solid var(--linea2);font-family:var(--fm);
  font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}

/* ── Trabajos ──────────────────────────────────────────────────────────── */
.trabajo{padding:28px;border-radius:20px;background:var(--vidrio);border:1px solid var(--linea);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 1px 0 var(--luz) inset,var(--sombra);margin-bottom:18px}
.trabajo-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  margin-bottom:16px;flex-wrap:wrap}
.trabajo-h .num{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--azul)}
.trabajo-h .zona{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--t3);padding:6px 11px;border-radius:8px;background:rgba(10,16,32,.04);white-space:nowrap}
.trabajo-r{font-size:14px;line-height:1.7;color:var(--t2);max-width:80ch;margin-bottom:20px}
.etapas{display:grid;gap:14px}
.etapas.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.etapas.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.etapas.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.etapas .foto{height:250px}

/* ── Método ────────────────────────────────────────────────────────────── */
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}
.paso{display:flex;flex-direction:column;gap:10px;padding:22px 20px;border-radius:16px;background:var(--vidrio2);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--linea);
  box-shadow:0 1px 0 var(--luz) inset}
.paso .n{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--azul);letter-spacing:.12em}
.paso .d{font-size:13px;line-height:1.62;color:var(--t2)}
.aviso{display:flex;align-items:flex-start;gap:14px;margin-top:20px;padding:18px 22px;border-radius:14px;
  background:rgba(27,71,255,.05);border:1px solid rgba(27,71,255,.16);font-size:13.5px;color:var(--t2);line-height:1.6}
.aviso svg{color:var(--azul);flex:none;margin-top:2px}
.aog{margin-top:18px;padding:26px;border-radius:18px;background:var(--tinta);color:#fff;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.aog .ico{width:46px;height:46px;border-radius:13px;flex:none;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.1);color:#fff;font-style:normal}
.aog .txt{flex:1;min-width:260px}
.aog .t{font-family:var(--fd);font-size:20px;font-weight:600;margin-bottom:6px}
.aog .d{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.75)}

/* ── Técnicas ──────────────────────────────────────────────────────────── */
.tecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tec{padding:22px;border-radius:16px;background:rgba(10,16,32,.028);border:1px solid var(--linea2)}
.tec .t{font-family:var(--fd);font-size:16.5px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.tec .d{font-size:13.5px;line-height:1.68;color:var(--t2)}

/* ── Trayectoria ───────────────────────────────────────────────────────── */
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tray-it{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:18px;
  background:var(--vidrio);backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--linea);
  box-shadow:0 1px 0 var(--luz) inset,var(--sombra)}
.tray-it.ahora{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tray-it.ahora .t,.tray-it.ahora b{color:#fff}
.tray-it.ahora .d{color:rgba(255,255,255,.78)}
.tray-it.ahora .per{color:var(--cian)}
.tray-it .per{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--azul)}
.tray-it .t{font-family:var(--fd);font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.tray-it .d{font-size:13.5px;line-height:1.68;color:var(--t2)}
.capac{margin-top:18px;padding:26px;border-radius:18px;background:rgba(10,16,32,.028);border:1px solid var(--linea2)}
.capac-h{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--t3);margin-bottom:16px}
.capac-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px 20px}
.capac-g span{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.5;color:var(--t2)}
.capac-g span::before{content:'';flex:none;width:5px;height:5px;border-radius:50%;
  background:var(--azul);opacity:.55;margin-top:7px}
.capac-p{margin-top:16px;padding-top:14px;border-top:1px solid var(--linea2);
  font-size:13px;line-height:1.65;color:var(--t2)}

/* ── Quién ─────────────────────────────────────────────────────────────── */
.quien{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:44px;align-items:start}
.quien .foto{height:430px;position:sticky;top:90px}
.quien .retrato img{object-position:50% 22%}
.quien-txt{display:flex;flex-direction:column;gap:22px;min-width:0}
.creds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cred{display:flex;gap:11px;padding:16px 18px;border-radius:14px;background:rgba(10,16,32,.03);
  border:1px solid var(--linea2)}
.cred svg{color:var(--azul);flex:none;margin-top:2px}
.cred .t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.cred .d{font-size:12.5px;line-height:1.55;color:var(--t2)}

/* ── Galería ───────────────────────────────────────────────────────────── */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gal .foto{height:270px}

/* ── Preguntas ─────────────────────────────────────────────────────────── */
.faqs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.faq details{border-radius:14px;background:var(--vidrio);border:1px solid var(--linea);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.faq summary{padding:17px 20px;cursor:pointer;font-size:14.5px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';margin-left:auto;font-family:var(--fm);font-size:17px;color:var(--azul);flex:none}
.faq details[open] summary::after{content:'–'}
.faq .r{padding:0 20px 18px;font-size:13.5px;line-height:1.7;color:var(--t2)}

/* ── Contacto ──────────────────────────────────────────────────────────── */
.contacto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.vias{display:flex;flex-direction:column;gap:12px}
.via{display:flex;align-items:center;gap:13px;padding:17px 20px;border-radius:14px;background:var(--vidrio);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--linea);
  box-shadow:0 1px 0 var(--luz) inset;text-decoration:none;color:inherit;transition:background .15s}
.via:hover{background:#fff}
.via i{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(27,71,255,.08);color:var(--azul);font-style:normal}
.via .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;color:var(--t3);display:block}
.via .v{font-size:15px;font-weight:600}
.form{display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:20px;background:var(--vidrio);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--linea);box-shadow:0 1px 0 var(--luz) inset,var(--sombra)}
.form-t{font-family:var(--fd);font-size:19px;font-weight:600}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-family:var(--fm);font-size:10px;letter-spacing:.12em;color:var(--t3)}
.campo input,.campo textarea{padding:13px 15px;border-radius:11px;background:#fff;border:1px solid var(--linea);
  font-family:var(--fb);font-size:13.5px;color:var(--tinta);resize:vertical;width:100%}
.campo input:focus,.campo textarea:focus{outline:2px solid rgba(27,71,255,.35);outline-offset:1px;border-color:transparent}
.campo input::placeholder,.campo textarea::placeholder{color:var(--t3)}
.nota-form{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;
  background:rgba(27,71,255,.05);border:1px dashed rgba(27,71,255,.25);font-size:12px;color:var(--t2);line-height:1.5}
.nota-form svg{color:var(--azul);flex:none}

/* ── Pie ───────────────────────────────────────────────────────────────── */
.pie-p{padding:30px 0;background:var(--tinta);color:rgba(255,255,255,.55)}
.pie-in{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
  max-width:var(--ancho);margin:0 auto;padding:0 32px;font-size:12.5px}
.pie-m{display:flex;align-items:center;gap:10px}
.pie-m i{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);color:#fff;font-style:normal}
.pie-m b{font-family:var(--fd);font-weight:600;color:#fff}
.pie-d{font-family:var(--fm);font-size:11px;letter-spacing:.08em}

/* ── Responsivo ────────────────────────────────────────────────────────── */
@media(max-width:1080px){
  .servs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pasos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .capac-g{grid-template-columns:repeat(3,minmax(0,1fr))}
  .etapas.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .menu{gap:14px;overflow-x:auto;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .quien{grid-template-columns:1fr;gap:28px}
  .quien .foto{position:static;height:340px}
}
@media(max-width:860px){
  .faqs,.tecs{grid-template-columns:1fr}
  .etapas.n3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-datos{grid-template-columns:repeat(2,auto);gap:20px 30px}
}
@media(max-width:820px){
  .wrap,.barra-in,.pie-in{padding-left:18px;padding-right:18px}
  .hero{grid-template-columns:1fr;gap:28px;padding-top:28px}
  .contacto,.creds{grid-template-columns:1fr}
  .servs,.tray{grid-template-columns:1fr}
  .capac-g{grid-template-columns:1fr}
  .capac,.trabajo{padding:20px}
  .marca .n span{display:none}
  .barra-d .btn span{display:none}
  .barra-d .btn{padding:11px 13px}
  .lang span{display:none}
  .lang{padding:11px 12px}
  /* El menú no se oculta en el teléfono: pasa a una tira que se desliza. */
  .menu{display:flex;order:3;flex-basis:100%;gap:16px;overflow-x:auto;padding:0 0 8px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .barra-in{height:auto;padding-top:10px;padding-bottom:0;flex-wrap:wrap;row-gap:4px}
  .wa-flota{display:flex}
  .gal{grid-template-columns:1fr}
  .gal .foto{height:230px}
  .aog{padding:20px;gap:16px}
}
@media(max-width:520px){
  .pasos,.etapas.n2,.etapas.n3,.etapas.n4{grid-template-columns:1fr}
  .hero-fotos{grid-template-columns:1fr}
  .hero-fotos .baja{height:200px}
  .form{padding:20px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover{transform:none}}
</style>
</head>
<body>

<header class="barra">
  <div class="barra-in">
    <a class="marca" href="#inicio">
      <i data-ico="heli"></i>
      <span class="n"><b>AERORESINAS</b><span data-t="marcaSub"></span></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <div class="barra-d">
      <button type="button" class="lang" id="lang" onclick="toggleIdioma()"><i data-ico="globo"></i><span id="lang-txt"></span></button>
      <a class="btn btn-p btn-sm" href="#contacto"><i data-ico="wa"></i><span>WhatsApp</span></a>
    </div>
  </div>
</header>

<section id="inicio">
  <div class="cielo"></div><div class="malla"></div>
  <div class="wrap">
    <div class="hero">
      <div class="hero-txt">
        <div class="ojo"><span data-t="heroOjo"></span> · <span data-campo="ciudad"></span></div>
        <h1 class="h1"><span data-t="heroT1"></span><br><em data-t="heroT2"></em></h1>
        <p class="sub" data-t="heroSub"></p>
        <div class="hero-btns">
          <a class="btn btn-p" href="#contacto"><i data-ico="wa"></i><span data-t="ctaDanio"></span></a>
          <a class="btn btn-s" href="#trabajos"><i data-ico="lupa"></i><span data-t="ctaCaso"></span></a>
        </div>
        <div class="hero-datos" id="hero-datos"></div>
      </div>
      <div class="hero-fotos">
        <figure class="foto alta"><img src="fotos/hero.jpg" alt="Evaluando un panel dañado en el hangar">
          <figcaption class="pie" data-t="pieHero"></figcaption></figure>
        <figure class="foto baja"><img src="fotos/composite-antes.jpg" alt="Daño en un panel de composite" loading="lazy">
          <figcaption class="pie" data-t="pieAntes"></figcaption></figure>
        <figure class="foto baja"><img src="fotos/composite-despues.jpg" alt="El mismo panel ya reparado" loading="lazy">
          <figcaption class="pie" data-t="pieDespues"></figcaption></figure>
      </div>
    </div>
  </div>
</section>

<section id="reparacion" class="sec sec-blanca">
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="repT"></h2><p class="sub" style="margin-top:10px" data-t="repSub"></p></div>
      <div class="sec-n" data-t="repN"></div>
    </div>
    <div class="servs" id="servicios"></div>
  </div>
</section>

<section id="trabajos" class="sec">
  <div class="cielo"></div>
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="trabT"></h2><p class="sub" style="margin-top:10px" data-t="trabSub"></p></div>
      <div class="sec-n" data-t="trabN"></div>
    </div>
    <div id="trabajos-lista"></div>
  </div>
</section>

<section id="flota" class="sec sec-blanca">
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="floT"></h2><p class="sub" style="margin-top:10px" data-t="floSub"></p></div>
      <div class="sec-n" data-t="floN"></div>
    </div>
    <div class="gal" id="flota-grid"></div>
  </div>
</section>

<section id="metodo" class="sec sec-blanca">
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="metT"></h2><p class="sub" style="margin-top:10px" data-t="metSub"></p></div>
      <div class="sec-n" data-t="metN"></div>
    </div>
    <div class="pasos" id="pasos"></div>
    <div class="aviso">
      <i data-ico="pin"></i>
      <div><b data-t="cobT"></b> <span data-campo="cobertura"></span>. <span data-t="cobD"></span></div>
    </div>
    <div class="aog">
      <i class="ico" data-ico="alerta"></i>
      <div class="txt"><div class="t" data-t="aogT"></div><div class="d" data-t="aogD"></div></div>
      <a class="btn btn-a" id="cta-aog" href="#contacto"><i data-ico="wa"></i><span data-t="aogCta"></span></a>
    </div>
  </div>
</section>

<section id="tecnicas" class="sec">
  <div class="cielo"></div>
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="tecT"></h2><p class="sub" style="margin-top:10px" data-t="tecSub"></p></div>
      <div class="sec-n" data-t="tecN"></div>
    </div>
    <div class="tecs" id="tecnicas-lista"></div>
  </div>
</section>

<section id="trayectoria" class="sec sec-blanca">
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="trayT"></h2><p class="sub" style="margin-top:10px" data-t="traySub"></p></div>
      <div class="sec-n" data-t="trayN"></div>
    </div>
    <div class="tray" id="trayectoria-lista"></div>
    <div class="capac">
      <div class="capac-h" data-t="capT"></div>
      <div class="capac-g" id="capacidades"></div>
      <p class="capac-p" data-t="capP"></p>
    </div>
  </div>
</section>

<section id="quien" class="sec">
  <div class="cielo"></div>
  <div class="wrap">
    <div class="quien">
      <figure class="foto retrato"><img src="fotos/retrato.jpg" alt="José Arturo Martínez Ponce" loading="lazy">
        <figcaption class="pie" data-t="pieRetrato"></figcaption></figure>
      <div class="quien-txt">
        <h2 class="h2" data-t="quienT"></h2>
        <p class="lead" data-t="quienD"></p>
        <div class="capac-h" data-t="credT" style="margin:6px 0 -6px"></div>
        <div class="creds" id="credenciales"></div>
      </div>
    </div>
  </div>
</section>

<section id="galeria" class="sec sec-blanca">
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="galT"></h2><p class="sub" style="margin-top:10px" data-t="galSub"></p></div>
      <div class="sec-n" data-t="galN"></div>
    </div>
    <div class="gal" id="galeria-grid"></div>
  </div>
</section>

<section id="faq" class="sec">
  <div class="cielo"></div>
  <div class="wrap">
    <div class="sec-h">
      <div><h2 class="h2" data-t="faqT"></h2></div>
      <div class="sec-n" data-t="faqN"></div>
    </div>
    <div class="faqs faq" id="faq-lista"></div>
  </div>
</section>

<section id="contacto" class="sec sec-blanca">
  <div class="wrap">
    <div class="contacto">
      <div style="display:flex;flex-direction:column;gap:20px">
        <h2 class="h2" data-t="conT"></h2>
        <p class="sub" data-t="conSub"></p>
        <div class="vias">
          <a class="via" id="via-wa" href="#contacto" target="_blank" rel="noopener">
            <i data-ico="wa"></i><div><span class="k" data-t="kWa"></span><span class="v" data-campo="whatsappTxt"></span></div></a>
          <a class="via" id="via-mail" href="#contacto">
            <i data-ico="mail"></i><div><span class="k" data-t="kMail"></span><span class="v" data-campo="correo"></span></div></a>
          <a class="via" id="via-in" href="#" target="_blank" rel="noopener">
            <i data-ico="linkedin"></i><div><span class="k" data-t="kIn"></span><span class="v" data-campo="linkedinTxt"></span></div></a>
          <a class="via" id="via-emp" href="#" target="_blank" rel="noopener">
            <i data-ico="linkedin"></i><div><span class="k" data-t="kEmp"></span><span class="v" data-campo="linkedinEmpTxt"></span></div></a>
          <div class="via">
            <i data-ico="pin"></i><div><span class="k" data-t="kBase"></span><span class="v" data-campo="ciudad"></span></div></div>
          <div class="via">
            <i data-ico="check"></i><div><span class="k" data-t="kLic"></span><span class="v" data-campo="licencia"></span></div></div>
        </div>
      </div>
      <form class="form" id="form" onsubmit="return enviarWhatsApp(event)">
        <div class="form-t" data-t="formT"></div>
        <div class="campo"><label data-t="fNombre"></label><input id="f-nombre" required></div>
        <div class="campo"><label data-t="fAeronave"></label><input id="f-aeronave"></div>
        <div class="campo"><label data-t="fQue"></label><textarea id="f-que" rows="3" required></textarea></div>
        <div class="nota-form"><i data-ico="check"></i><span data-t="formNota"></span></div>
        <button class="btn btn-p" type="submit"><i data-ico="wa"></i><span data-t="formBtn"></span></button>
      </form>
    </div>
  </div>
</section>

<a class="wa-flota btn-p" id="wa-flota" href="#contacto" aria-label="WhatsApp"><i data-ico="wa"></i></a>

<footer class="pie-p">
  <div class="pie-in">
    <div class="pie-m"><i data-ico="heli"></i><b>AERORESINAS</b></div>
    <div class="pie-d"><span data-campo="ciudad"></span> · MÉXICO · <span id="anio"></span></div>
  </div>
</footer>

<script src="datos.js"></script>
<script>
/* El molde: todo el texto viene de datos.js. Aquí solo se pinta y se enlaza. */
const ICO = {
  heli:'<path d="M3 6h18M12 6v3"/><path d="M6 12h9a3 3 0 0 1 3 3v2H8a2 2 0 0 1-2-2z"/><path d="M18 15h3M7 17v3M13 17v3M5 20h10"/>',
  estruc:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  corro:'<path d="M4 15a4 4 0 0 1 4-4 5 5 0 0 1 9.5-1.5A3.5 3.5 0 0 1 19 15z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 21h.01M14 21h.01"/>',
  cristal:'<path d="M4 14c1.5-5 4-8 8-8s6.5 3 8 8z"/><path d="M12 6v8M8 9l4 3 4-3"/>',
  antena:'<path d="M12 21v-7"/><path d="M8 14a4 4 0 0 1 8 0z"/><path d="M6.5 8a7 7 0 0 1 11 0M4 5a11 11 0 0 1 16 0"/>',
  fuse:'<path d="M2 14c4-5 9-7 14-7 3 0 6 1 6 3s-3 3-6 3H8z"/><path d="M8 13l-2 5M14 7l3-4"/>',
  panel:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9.5h18M3 14.5h18M8 5v14M16 5v14"/>',
  remache:'<circle cx="7" cy="8" r="1.6"/><circle cx="17" cy="8" r="1.6"/><circle cx="7" cy="16" r="1.6"/><circle cx="17" cy="16" r="1.6"/><path d="M12 4v16"/>',
  wa:'<path d="M3 21l1.6-4.4A8 8 0 1 1 8 20.3z"/><path d="M8.5 9.5c0 3 2.5 5.5 5.5 5.5.6 0 1.2-.7 1.2-1.3l-1.6-.9-1 1a6 6 0 0 1-2.4-2.4l1-1-.9-1.6c-.6 0-1.3.6-1.3 1.2z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  pin:'<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  lupa:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  alerta:'<path d="M12 3.5 21.5 20h-19z"/><path d="M12 10v4M12 17h.01"/>',
  linkedin:'<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M7.5 10.5v6M7.5 7.6v.01M11.5 16.5v-6M11.5 13a2.5 2.5 0 0 1 5 0v3.5"/>',
  globo:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>',
};
const svg = (k, sz) => '<svg viewBox="0 0 24 24" width="' + (sz||18) + '" height="' + (sz||18) +
  '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICO[k]||'') + '</svg>';

let IDIOMA = 'es';
const marcado = v => /^\[.*\]$/.test(String(v).trim());
const campo = k => { const v = PERFIL[k] || ''; return marcado(v) ? '<span class="pend">' + v + '</span>' : v; };
const rell = txt => String(txt).replace(/\{(\w+)\}/g, (_, k) => campo(k));
const pon = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };

function pinta(){
  const t = T[IDIOMA];
  document.documentElement.lang = IDIOMA;
  document.querySelectorAll('[data-t]').forEach(function(el){
    const k = el.getAttribute('data-t');
    if(typeof t[k] === 'string') el.innerHTML = rell(t[k]);
  });
  document.querySelectorAll('[data-campo]').forEach(function(el){
    const v = PERFIL[el.getAttribute('data-campo')];
    if(v == null) return;
    el.textContent = v; el.classList.toggle('pend', marcado(v));
  });
  pon('menu', t.nav.map(x => '<a href="' + x[0] + '">' + x[1] + '</a>').join(''));
  pon('hero-datos', t.datos.map(d =>
    '<div class="dato"><span class="v">' + rell(d[0]) + '</span><span class="k">' + rell(d[1]) + '</span></div>').join(''));
  pon('servicios', t.servicios.map(s =>
    '<article class="serv"><div class="im"><img src="' + s[2] + '" alt="' + s[1] + '" loading="lazy"></div>' +
    '<div class="cuerpo"><div class="serv-ico">' + svg(s[0], 19) + '</div>' +
    '<h3 class="h3">' + s[1] + '</h3><p class="d">' + s[3] + '</p>' +
    '<p class="ojo2">' + s[4] + '</p><div class="pie2">' + s[5] + '</div></div></article>').join(''));
  pon('trabajos-lista', t.trabajos.map(function(w, i){
    return '<article class="trabajo"><div class="trabajo-h">' +
      '<div><div class="num">TRABAJO 0' + (i+1) + '</div><h3 class="h3" style="margin-top:6px">' + w.t + '</h3></div>' +
      '<div class="zona">' + w.z + '</div></div>' +
      '<p class="trabajo-r">' + w.r + '</p>' +
      '<div class="etapas n' + w.f.length + '">' + w.f.map(f =>
        '<figure class="foto"><img src="' + f[0] + '" alt="" loading="lazy">' +
        '<figcaption class="pie">' + f[1] + '</figcaption></figure>').join('') + '</div></article>';
  }).join(''));
  pon('pasos', t.pasos.map((p, i) =>
    '<div class="paso"><div class="n">0' + (i+1) + '</div><h3 class="h3" style="font-size:16.5px">' + p[0] +
    '</h3><div class="d">' + p[1] + '</div></div>').join(''));
  pon('tecnicas-lista', t.tecnicas.map(x =>
    '<div class="tec"><div class="t">' + x[0] + '</div><div class="d">' + x[1] + '</div></div>').join(''));
  pon('trayectoria-lista', t.trayectoria.map(x =>
    '<article class="tray-it' + (x[3] ? ' ahora' : '') + '"><div class="per">' + x[0] + '</div>' +
    '<h3 class="t">' + x[1] + '</h3><p class="d">' + x[2] + '</p></article>').join(''));
  pon('capacidades', t.capacidades.map(c => '<span>' + c + '</span>').join(''));
  pon('credenciales', t.credenciales.map(c =>
    '<div class="cred">' + svg('check', 15) + '<div><div class="t">' + rell(c[0]) + '</div>' +
    '<div class="d">' + rell(c[1]) + '</div></div></div>').join(''));
  pon('flota-grid', t.flota.map(g =>
    '<figure class="foto"><img src="' + g[0] + '" alt="" loading="lazy">' +
    '<figcaption class="pie">' + g[1] + '</figcaption></figure>').join(''));
  pon('galeria-grid', t.galeria.map(g =>
    '<figure class="foto"><img src="' + g[0] + '" alt="" loading="lazy">' +
    '<figcaption class="pie">' + g[1] + '</figcaption></figure>').join(''));
  pon('faq-lista', t.faq.map(f =>
    '<details><summary>' + f[0] + '</summary><div class="r">' + f[1] + '</div></details>').join(''));
  const ph = {'f-nombre':'phNombre','f-aeronave':'phAeronave','f-que':'phQue'};
  Object.keys(ph).forEach(function(id){ const el = document.getElementById(id); if(el) el.placeholder = t[ph[id]]; });
  document.querySelectorAll('[data-ico]').forEach(function(el){
    if(!el.querySelector('svg')) el.innerHTML = svg(el.getAttribute('data-ico'), el.closest('.marca,.pie-m,.aog') ? 20 : 17);
  });
  document.getElementById('lang-txt').textContent = t.otroIdioma;
  const wa = PERFIL.whatsapp ? 'https://wa.me/' + PERFIL.whatsapp : '#contacto';
  document.getElementById('via-wa').href = wa;
  document.getElementById('wa-flota').href = wa;
  document.getElementById('via-in').href = PERFIL.linkedin;
  document.getElementById('via-emp').href = PERFIL.linkedinEmp;
  document.getElementById('via-mail').href = marcado(PERFIL.correo) ? '#contacto' : 'mailto:' + PERFIL.correo;
  // El botón del AOG lleva el mensaje ya escrito: quien tiene una aeronave parada no está
  // para redactar.
  document.getElementById('cta-aog').href = PERFIL.whatsapp
    ? 'https://wa.me/' + PERFIL.whatsapp + '?text=' + encodeURIComponent(t.waAog) : '#contacto';
}
function setIdioma(x){ IDIOMA = x; try{ localStorage.setItem('aero-idioma', x); }catch(e){} pinta(); }
function toggleIdioma(){ setIdioma(IDIOMA === 'es' ? 'en' : 'es'); }

function enviarWhatsApp(ev){
  ev.preventDefault();
  const t = T[IDIOMA];
  const v = id => (document.getElementById(id).value || '').trim();
  const msg = [t.waSaludo, '', t.waNombre + ': ' + v('f-nombre'),
    v('f-aeronave') ? t.waAeronave + ': ' + v('f-aeronave') : '',
    t.waQue + ': ' + v('f-que')].filter(Boolean).join('\n');
  window.open('https://wa.me/' + PERFIL.whatsapp + '?text=' + encodeURIComponent(msg), '_blank');
  return false;
}

(function init(){
  // Español por defecto SIEMPRE: el cliente de aquí es mexicano. El inglés queda a un
  // toque, en el botón de la barra.
  try{ IDIOMA = localStorage.getItem('aero-idioma') || 'es'; }catch(e){ IDIOMA = 'es'; }
  document.getElementById('anio').textContent = new Date().getFullYear();
  pinta();
})();
</script>
</body>
</html>
