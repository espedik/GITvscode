<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aeroresinas — Trabajos en el teléfono</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6b8cff}a:hover{color:#9db2ff}
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a1020; color: #f3f5fa; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 30px 18px 16px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: center; gap: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{acento}};">
      <span style="width: 20px; height: 1px; background: {{acento}};"></span>CASOS REALES
    </div>
    <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 31px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1;">Catorce aeronaves, abiertas y cerradas.</h2>
    <div style="display: flex; gap: 26px; padding-top: 4px;">
      <sc-for list="{{cifras}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: {{acento}};">{{c.n}}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #7d89a3; text-transform: uppercase;">{{c.k}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- En el teléfono los filtros son una tira que se desliza: ocupa una línea
       y sustituye a las 43 pantallas de scroll que había. -->
  <div style="display: flex; gap: 7px; padding: 0 18px 16px; overflow: hidden;">
    <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
      <button type="button" style="padding: 9px 14px; border-radius: 999px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; flex: none;">{{f.n}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 0 18px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <a href="Ficha.dc.html" style="position: relative; height: 210px; border-radius: 17px; overflow: hidden; text-decoration: none; color: inherit; display: block; border: 1px solid rgba(255,255,255,0.1); flex: none;">
      <img src="/_blob/cae01de0158a6b80a2e7b4b5a34e2c1f" alt="El panel del costado abierto" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,10,22,0.95) 0%, rgba(6,10,22,0.3) 50%, transparent 72%);"></div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 15px; display: flex; flex-direction: column; gap: 7px;">
        <span style="align-self: flex-start; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.12em; padding: 4px 9px; border-radius: 5px; background: rgba(0,194,212,0.2); color: #4fe0ee;">COMPOSITE · VACÍO</span>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.22;">Costado bajo el parabrisas</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: {{acento}};">6 etapas · el caso completo</div>
      </div>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{casos}}" as="c" hint-placeholder-count="4">
        <a href="Ficha.dc.html" style="display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09); text-decoration: none; color: inherit;">
          <div style="height: 96px; background: {{c.tint}}; overflow: hidden;">
            <sc-if value="{{c.foto}}" hint-placeholder-val="{{true}}">
              <img src="{{c.foto}}" alt="{{c.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </sc-if>
          </div>
          <div style="padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
            <div style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; line-height: 1.3;">{{c.t}}</div>
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7d89a3; margin-top: auto;">{{c.e}} etapas →</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#6b8cff","options":["#6b8cff","#00c2d4","#ff9e6b","#7cf5b0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.acento ?? '#6b8cff';
    return {
      acento: a,
      cifras: [ { n: '14', k: 'Trabajos' }, { n: '51', k: 'Etapas' }, { n: '08', k: 'Técnicas' } ],
      filtros: [
        { n: 'Todos', bg: a, bd: a, fg: '#0a1020' },
        { n: 'Composite', bg: 'rgba(255,255,255,0.05)', bd: 'rgba(255,255,255,0.14)', fg: '#c3ccdd' },
        { n: 'Corrosión', bg: 'rgba(255,255,255,0.05)', bd: 'rgba(255,255,255,0.14)', fg: '#c3ccdd' },
        { n: 'Antenas', bg: 'rgba(255,255,255,0.05)', bd: 'rgba(255,255,255,0.14)', fg: '#c3ccdd' }
      ],
      casos: [
        { t: 'Techo con corrosión', e: 5, foto: '/_blob/293654ddb3e0cf8288626013f485f41a', alt: 'Techo decapado con corrosión', tint: '#131c33' },
        { t: 'Antenas y puenteo', e: 5, foto: '/_blob/2c16ff9d11ecaa7e04f3ea2da9dfc3be', alt: 'Tiras de puenteo en estrella', tint: '#131c33' },
        { t: 'Estabilizador horizontal', e: 3, foto: '/_blob/20f5f7417c4f546d6bf0897f26aa7ae5', alt: 'Núcleo verde a la vista', tint: '#131c33' },
        { t: 'Nariz del monomotor', e: 4, foto: '/_blob/633fb88f3983d3140845b32d49478723', alt: 'Nariz terminada', tint: '#131c33' }
      ]
    };
  }
}
</script>
</body>
</html>
