<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Sin caché: estas apps se editan a diario y abiertas con file:// Chrome se queda
     con la copia vieja hasta un Ctrl+F5. Ya costó varias veces creer que un cambio
     no se había aplicado cuando en disco sí estaba. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Guía de Vestimenta</title>
<meta name="description" content="Guía personal de guardarropa: básicos, chaquetas, zapatos y outfits por ocasión (trabajo, casual, ejercicio, bodas, fiestas).">
<!-- La fuente se carga SIN bloquear el pintado (2026-08-23). Antes era un `@import` dentro
     del <style>: el navegador no lo descubría hasta parsear el CSS y, mientras Google no
     contestaba, no pintaba nada — con la conexión lenta o caída, la página se quedaba
     esperando. Con media="print" la hoja no bloquea, y el onload la activa al llegar.
     La tipografía de respaldo ya está en cada font-family, así que el texto se lee desde
     el primer instante. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#c17f4a;--p-d:#9c632f;--p-l:rgba(193,127,74,.12);
  --g:#00a758;--g-l:rgba(0,167,88,.1);
  --r:#ff3b6b;--r-l:rgba(255,59,107,.1);
  --w:#ffd93d;
  --bg:#0a0908;--text:#f0ece6;--text2:#a89e91;--text3:#6b6156;
  --surface:#151311;--surface-2:#1a1815;--surface-3:#1e1c18;
  --border:rgba(var(--ov),.08);--ov:255,255,255;
  --sw:245px;--r14:14px;--rs:9px;--sh:0 4px 24px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --p:#a4632f;--p-d:#824c22;--p-l:rgba(164,99,47,.1);
  --g:#00a758;--r:#c81e4d;--w:#a8790a;
  --bg:#f6f3ee;--text:#211d18;--text2:#6b6255;--text3:#95897a;
  --surface:#ffffff;--surface-2:#ffffff;--surface-3:#ffffff;--ov:0,0,0;
  --sh:0 2px 14px rgba(0,0,0,.08);
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(var(--ov),.14);border-radius:2px}
.sidebar{width:var(--sw);background:var(--surface);border-right:1px solid rgba(var(--ov),.08);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sb-logo{padding:20px;border-bottom:1px solid rgba(var(--ov),.06)}
.sb-logo h1{font-size:16px;font-weight:800;letter-spacing:-.2px}
.sb-logo p{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.sb-nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;padding:12px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);cursor:pointer;color:var(--text2);font-weight:500;font-size:13px;transition:all .2s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:rgba(var(--ov),.05);color:var(--text)}
.nav-item.active{background:var(--p-l);color:var(--p);font-weight:600;border-left:2px solid var(--p)}
.nav-item .ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.main{margin-left:var(--sw);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid rgba(var(--ov),.06);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:700}
.content{padding:24px;flex:1;max-width:1280px}
.section{display:none}.section.active{display:block}
.card{background:var(--surface-2);border:1px solid rgba(var(--ov),.07);border-radius:var(--r14);padding:18px;box-shadow:var(--sh)}
.sh{margin-bottom:18px}
.sh h2{font-size:20px;font-weight:800}
.sh .sub{font-size:12.5px;color:var(--text2);margin-top:4px;line-height:1.6;max-width:760px}
.intro-banner{border-color:rgba(193,127,74,.28);background:var(--p-l);margin-bottom:20px}
/* ── COLORIMETRÍA ────────────────────────────────────────────────────────
   La matriz: 16 playeras en FILAS y 6 pantalones en columnas. Al revés no cabe —
   16 columnas no entran ni en escritorio— y así entra entera sin apretar nada.
   El semáforo usa los acentos que ya tiene la app (--g, --w, --r), no colores
   nuevos: el verde y el rojo del veredicto son los mismos de todo el proyecto. */
.cm-ley{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.cm-ley span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text2)}
.cm-ley i{flex:none}
.cm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cm-tabla{min-width:600px}
.cm-cab,.cm-fila{display:grid;grid-template-columns:168px repeat(6,minmax(56px,1fr))}
.cm-cab{align-items:end;padding-bottom:9px;border-bottom:1px solid rgba(var(--ov),.16)}
.cm-lbl{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text3);padding-bottom:4px}
.cm-p{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 4px;cursor:help}
.cm-sw{width:100%;height:30px;border-radius:7px;border:1px solid rgba(var(--ov),.16)}
.cm-pn{font-size:10.5px;font-weight:700;color:var(--text2);text-align:center;line-height:1.25}
.cm-fila{align-items:center;border-top:1px solid rgba(var(--ov),.07)}
.cm-et{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 0;min-width:0}
.cm-sw2{width:28px;height:28px;border-radius:7px;flex:none;border:1px solid rgba(var(--ov),.16)}
.cm-tn{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.cm-cel{display:flex;align-items:center;justify-content:center;height:42px}
/* El veredicto es un punto y no una palabra: son 96 celdas, y leer 96 etiquetas no
   es leer. La forma también lo dice, no solo el color — círculo lleno, aro y raya —
   para que se distinga en blanco y negro y con cualquier daltonismo. */
.cm-pt{display:block;width:13px;height:13px;border-radius:50%;cursor:help}
.cm-pt.si{background:var(--g)}
.cm-pt.ojo{background:transparent;border:2.5px solid var(--w)}
.cm-pt.no{height:2.5px;border-radius:2px;background:var(--r)}
.cm-nota{margin-top:16px;border-color:rgba(193,127,74,.28)}
.cm-nota .t{font-size:13px;font-weight:800;margin-bottom:9px}
.cm-nota ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.cm-nota li{font-size:12.5px;color:var(--text2);line-height:1.55}
.cm-nota li b{color:var(--text)}
/* ── COMBINACIONES ───────────────────────────────────────────────────────
   Cada una es dos bloques de color, uno encima del otro y en el orden en que se
   ven: playera arriba, pantalón abajo. Eso ES la combinación — el resto es texto
   que la explica. La proporción no es 50/50 porque un pantalón ocupa más cuerpo. */
.cb-filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cb-f{padding:7px 13px;border-radius:20px;border:1.5px solid rgba(var(--ov),.12);
  background:var(--surface-2);color:var(--text2);font:600 12px inherit;font-family:inherit;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .18s}
.cb-f:hover{border-color:rgba(193,127,74,.4);color:var(--text)}
.cb-f b{font-size:10.5px;font-weight:800;color:var(--text3);font-variant-numeric:tabular-nums}
.cb-f.on{background:var(--p);border-color:var(--p);color:#fff}
.cb-f.on b{color:rgba(255,255,255,.85)}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;
  align-items:start}
.cb-grid>*{min-width:0}
.cb{border-radius:var(--r14);border:1px solid rgba(var(--ov),.07);background:var(--surface-2);
  box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.cb-color{display:flex;flex-direction:column}
.cb-t{height:52px}
.cb-p{height:74px;border-top:1px solid rgba(var(--ov),.14)}
.cb-body{padding:12px 14px 13px;display:flex;flex-direction:column;gap:7px}
.cb-n{font-size:13.5px;font-weight:800;line-height:1.3;color:var(--text)}
.cb-n span{color:var(--text3);font-weight:600;margin:0 2px}
.cb-por{font-size:11.5px;color:var(--text2);line-height:1.5}
.cb-ocs{display:flex;flex-direction:column;gap:4px;margin-top:2px;padding-top:9px;
  border-top:1px solid rgba(var(--ov),.07)}
.cb-oc{font-size:10.5px;font-weight:700;color:var(--p);cursor:help}
.intro-banner .t{font-size:13px;font-weight:800;color:var(--p);margin-bottom:4px}
.intro-banner .d{font-size:12.5px;color:var(--text2);line-height:1.65}
.theme-toggle-btn{background:rgba(var(--ov),.06);border:1px solid rgba(var(--ov),.12);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-toggle-btn:hover{background:rgba(var(--ov),.12)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.b-p{background:var(--p-l);color:var(--p);border:1px solid rgba(193,127,74,.3)}
.b-g{background:var(--g-l);color:var(--g);border:1px solid rgba(0,167,88,.25)}
.b-n{background:rgba(var(--ov),.07);color:var(--text2)}

/* Fase / plan de compra */
.fase-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px}
.fase-card{border-radius:12px;border:1px solid rgba(var(--ov),.08);background:rgba(var(--ov),.025);padding:14px}
.fase-card .fn{font-size:10px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.fase-card ul{list-style:none;font-size:12px;color:var(--text2);line-height:1.9}
.fase-card ul li::before{content:"— "}
.fase-card .tot{margin-top:8px;font-size:12px;font-weight:800;color:var(--text)}

/* Grid de items comprables */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.item-card{border-radius:var(--r14);border:1px solid rgba(var(--ov),.07);background:var(--surface-2);overflow:hidden;box-shadow:var(--sh);transition:border-color .2s,transform .2s}
.item-card:hover{border-color:rgba(193,127,74,.35);transform:translateY(-2px)}
.item-body{padding:15px}
.item-body h3{font-size:14.5px;font-weight:800;margin-bottom:4px}
.item-use{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.buy-list{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.buy-opt{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;background:rgba(var(--ov),.04);padding:6px 9px;border-radius:6px}
.buy-opt .store{color:var(--text2);font-weight:600}
.buy-opt .store a{color:var(--p);text-decoration:none;border-bottom:1px dashed rgba(var(--ov),.3)}
.buy-opt .store a:hover{color:var(--p-d);border-bottom-color:var(--p-d)}
.buy-opt .price{color:var(--p);font-weight:800;white-space:nowrap}
.item-tip{font-size:11px;color:var(--text3);font-style:italic;line-height:1.5}
.item-check{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(var(--ov),.06);cursor:pointer;user-select:none}
.item-check input{width:15px;height:15px;accent-color:var(--g);cursor:pointer}
.item-check span{font-size:11.5px;color:var(--text2);font-weight:600}
.item-card.checked{border-color:rgba(0,167,88,.4)}

/* Combos por ocasión — el combo se dibuja con las fotos de sus propias piezas, así
   que no hay foto de outfit: la tarjeta es cabecera + tira de piezas + pie. */
.combo-card{border-radius:var(--r14);border:1px solid rgba(var(--ov),.07);background:var(--surface-2);box-shadow:var(--sh);margin-bottom:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.combo-card.listo{border-color:rgba(0,167,88,.35)}
.combo-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.combo-h>div:first-child{flex:1;min-width:0}
.combo-h h3{font-size:15px;font-weight:800;letter-spacing:-.015em}
.combo-desc{font-size:12.5px;color:var(--text2);line-height:1.6;margin-top:5px;max-width:640px}
.combo-est{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:5px 11px;border-radius:7px;white-space:nowrap}
.combo-est.falta{color:var(--p);background:var(--p-l);border:1px solid rgba(193,127,74,.42)}
.combo-est.ok{color:var(--g);background:var(--g-l);border:1px solid rgba(0,167,88,.25)}
.combo-est.lejos{color:var(--text3);background:rgba(var(--ov),.05);border:1px solid rgba(var(--ov),.08)}

.pz-list{display:flex;gap:12px;flex-wrap:wrap}
/* Una pieza de un combo. Era una miniatura con foto; ahora es una ficha de texto:
   lo que hay que saber de ella es si la tienes y cuánto cuesta, no cómo se ve. */
.pz{width:126px;display:flex;flex-direction:column;gap:5px;padding:9px 10px;
  border-radius:10px;background:rgba(var(--ov),.04);border:1px solid rgba(var(--ov),.07)}
.pz.tengo{border-color:rgba(0,167,88,.35)}
.pz.sin{border-style:dashed}
.pz-ok{color:var(--g);font-weight:800;margin-right:4px}
/* Una prenda que ninguna de las cuatro categorías cubre: no se finge que la tienes. */
.pz-n{font-size:11px;font-weight:700;line-height:1.35;color:var(--text)}
.pz-p{font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--p);font-variant-numeric:tabular-nums}
.pz.tengo .pz-p{color:var(--g)}
.pz.sin .pz-p{color:var(--text3);font-weight:600;letter-spacing:0}

.combo-f{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:12px;border-top:1px solid rgba(var(--ov),.06)}
.combo-f-t{font-size:11.5px;color:var(--text3);line-height:1.6}
.combo-f-t b{color:var(--text2);font-weight:700}
.combo-f-r{text-align:right;flex:none}
.combo-f-v{font-size:16px;font-weight:800;color:var(--p);line-height:1.1;font-variant-numeric:tabular-nums}
.combo-card.listo .combo-f-v{color:var(--g)}
.combo-f-k{font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-top:3px}
@media(max-width:900px){.fase-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.fase-grid{grid-template-columns:1fr}}

/* ─── Responsivo — iPad / iPhone 15 Pro (2026-08-03) ───────────────────────
   Los breakpoints 760/900/640 de arriba ya existían y funcionan (grid de
   fases, sidebar off-canvas). Lo que faltaba:
   1) el botón ☰ (#menuBtn) para abrir el sidebar en móvil tenía
      style="display:none" puesto INLINE en el HTML — un media query normal
      no le gana a un inline style, hace falta !important.
   2) red de seguridad min-width:0 en los grids por si algún item-card con
      texto largo fuerza overflow (los grid item tienen min-width:auto
      implícito y no se encogen aunque la columna sea 1fr/minmax).
   3) compactar padding/tipografía en iPad (800px) y aún más en iPhone (480px). */
.fase-grid > *, .item-grid > * { min-width: 0 }
@media(max-width:800px){
  .content{padding:18px}
  .sh h2{font-size:18px}
  .combo-card{padding:16px 18px}
}
@media(max-width:640px){
  #menuBtn{display:flex !important}
}
@media(max-width:480px){
  .content{padding:14px}
  .topbar{padding:0 14px}
  .item-body{padding:13px}
  .sh h2{font-size:17px}
  .fase-grid{gap:10px}
  .combo-card{padding:14px 15px;gap:12px}
  .pz-list{gap:9px}
  .pz{width:calc((100% - 18px) / 3)}
}
.cp-cab-fuera{padding:24px 24px 0}
@media(max-width:760px){.cp-cab-fuera{padding:16px 14px 0}}
@media(max-width:760px){
  .cm-cab,.cm-fila{grid-template-columns:132px repeat(6,minmax(52px,1fr))}
  .cm-tabla{min-width:490px}
  /* La etiqueta se queda pegada al borde: sin esto, a la segunda columna ya no se
     sabe de qué playera es la fila. Lleva el fondo de la tarjeta para tapar lo que
     pasa por debajo. */
  .cm-et{position:sticky;left:0;z-index:1;background:var(--surface-2);padding-right:8px}
  .cm-lbl{position:sticky;left:0;z-index:1;background:var(--surface-2)}
  .cm-sw2{width:24px;height:24px}
  .cm-tn{font-size:11.5px}
}
</style>
<!-- El material comun de las 8 areas: velos de blanco con desenfoque.
     Va despues del <style> para ganar por orden. Ver vidrio.css. -->
<link rel="stylesheet" href="../CuidadoPersonal/vidrio.css">
<script src="../Dashboard/datos-maestros.js"></script>
<script src="../CuidadoPersonal/cabecera.js"></script>
<script>
(function () {
  var saved = localStorage.getItem('coach-theme');
  var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>

  <div class="sb-logo">
    <h1>👔 Mi Vestimenta</h1>
    <p>Guardarropa y guía de compras</p>
  </div>
  <nav class="sb-nav">
    <div class="nav-label">Principal</div>
    <div class="nav-item active" onclick="nav('inicio')"><span class="ico">🏠</span>Inicio</div>
    <div class="nav-label">Qué comprar</div>
    <div class="nav-item" onclick="nav('basicos')"><span class="ico">👕</span>Básicos</div>
    <div class="nav-item" onclick="nav('chaquetas')"><span class="ico">🧥</span>Chaquetas</div>
    <div class="nav-item" onclick="nav('zapatos')"><span class="ico">👞</span>Zapatos</div>
    <div class="nav-item" onclick="nav('accesorios')"><span class="ico">⌚</span>Accesorios</div>
    <div class="nav-label">Cómo combinar</div>
    <div class="nav-item" onclick="nav('colorimetria')"><span class="ico">🎨</span>Colorimetría</div>
    <div class="nav-item" onclick="nav('combinaciones')"><span class="ico">🧩</span>Combinaciones</div>
    <div class="nav-label">Aparte</div>
    <div class="nav-item" onclick="nav('ejercicio')"><span class="ico">🏋️</span>Ejercicio</div>
    <div class="nav-item" onclick="nav('bodas')"><span class="ico">💍</span>Bodas</div>
  </nav>
  <div style="padding:12px;border-top:1px solid rgba(var(--ov),.06);font-size:10px;color:var(--text3);line-height:1.6">

  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="theme-toggle-btn" id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none;border-radius:6px">☰</button>
      <span class="topbar-title" id="topTitle">🏠 Inicio</span>

  <!-- Fuera de #content-root: la app lo vacia en cada navegacion y se llevaria
       la cabecera con el. El padding se lo da .cp-cab-fuera. -->
  <div id="cp-cab" class="cp-cab-fuera"></div>
  <div class="content" id="content-root">
    <!-- El contenido de cada sección se inserta abajo -->
  </div>
</main>

<!-- Sin caché, también para los .js. Los <meta> de arriba solo cubren el documento:
     con file:// Chrome se queda con el script viejo y se ve el CSS nuevo con la lógica
     vieja — que es exactamente "no se aplicó el cambio" sin que nada falle. `document.write`
     va en el mismo punto del documento, así que el orden de carga no cambia. -->
<script>window.__v = Date.now();</script>
<script>document.write('<scr' + 'ipt src="vestimenta_data.js?v=' + window.__v + '"><\/scr' + 'ipt>');</script>
<script>
// La cabecera del area. Las prendas marcadas salen del mismo localStorage que
// usan las casillas de cada seccion; el total, de cuantas hay dibujadas.
function cpCabVest(){
  if(typeof cpCabecera!=='function') return;
  var marcadas=0, total=0;
  try{
    var st=JSON.parse(localStorage.getItem('vestimenta_v1')||'{}');
    marcadas=(st.marcados||[]).length;
  }catch(e){}
  // El total son las prendas dibujadas en la seccion abierta; en Inicio no hay
  // ninguna, asi que ahi se ensena solo cuantas llevas marcadas.
  total=document.querySelectorAll('.item-check').length;
  cpCabecera('#cp-cab',{
    area:'vestimenta',
    ojo:'Tu guardarropa',
    titulo:'Vestimenta, por fases',
    sub:'versatilidad antes que cantidad',
    kpis:[
      {v:marcadas+(total?' / '+total:''), k:'Prendas que ya tienes'},
      // Derivadas, no escritas: «5 ocasiones cubiertas» siguio ahi despues de que las
      // ocasiones cambiaran, y una cifra a mano solo miente en cuanto el dato se mueve.
      {v:String(typeof FASES!=='undefined'?FASES.length:''), k:'Fases de compra'},
      {v:String(typeof combLista==='function'?combLista().length:''), k:'Combinaciones'},
    ],
  });
}
</script>
<script>document.write('<scr' + 'ipt src="vestimenta_app.js?v=' + window.__v + '"><\/scr' + 'ipt>');</script>
<script>
// La app pinta su contenido al cargar; la cabecera se pone justo despues.
if(document.readyState!=='loading') setTimeout(cpCabVest,80);
else window.addEventListener('DOMContentLoaded',function(){setTimeout(cpCabVest,80);});
</script>
<!-- Vista desde el shell (?embed=1): calla el carril y la cabecera propios,
     y habla con cuidadopersonal.html por postMessage. Sola, no cambia nada. -->
<script src="../CuidadoPersonal/embed.js"></script>
</body>
</html>
