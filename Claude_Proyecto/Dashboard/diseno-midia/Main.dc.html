<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Día — Ahora y lo que viene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00e87a}a:hover{color:#5cffb4}
</style>
</helmet>

<div style="width: 440px; height: 920px; box-sizing: border-box; background: linear-gradient(162deg, #17393e 0%, #0f2b2f 42%, #0b2225 100%); border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; color: #f4f4f8; overflow: hidden;">

  <!-- Cabecera: la hora manda, el progreso deja de ser una frase y pasa a ser una barra -->
  <div style="display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: {{acento}}; text-transform: uppercase;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: {{acento}}; flex-shrink: 0;"></span>
      <span>Mi día</span>
      <span style="color: #7f8aa0;">·</span>
      <span style="color: #9aa5b8; letter-spacing: 0.1em;">Jueves 17 de septiembre</span>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
      <div style="font-family: 'Space Grotesk', monospace; font-size: 46px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em;">19:39</div>
      <div style="text-align: right; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-family: 'Space Grotesk', monospace; font-size: 19px; font-weight: 700; color: {{acento}}; line-height: 1;">8<span style="color: #7f8aa0; font-size: 13px;"> / 21</span></div>
        <div style="font-size: 10.5px; color: #9aa5b8;">quedan 4 h 50 m</div>
      </div>
    </div>

    <!-- Progreso del día. Sustituye a "0 de 21 bloques hechos", que era texto perdido. -->
    <div style="height: 5px; border-radius: 99px; background: rgba(255,255,255,0.09); overflow: hidden;">
      <div style="width: 38%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, {{acento}}, #00e0c0);"></div>
    </div>
  </div>

  <!-- LO PASADO, PLEGADO. 14 bloques ocupaban 490 px y ya no se pueden cambiar. -->
  <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035); color: #9aa5b8; font-family: 'Inter', sans-serif; font-size: 12px; text-align: left; cursor: pointer;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"/></svg>
    <span style="flex-grow: 1;"><b style="color: #d7dbe6; font-weight: 600;">14 bloques</b> antes de las 19:30</span>
    <span style="display: flex; gap: 3px; align-items: center;">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #2fe39c;"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #2fe39c;"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #2fe39c;"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.22);"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #2fe39c;"></span>
      <span style="font-family: 'Space Grotesk', monospace; font-size: 10px; color: #7f8aa0; margin-left: 3px;">+9</span>
    </span>
  </button>

  <!-- AHORA: tarjeta propia. El título entero, la cuenta atrás y el botón que importa. -->
  <div style="display: flex; flex-direction: column; gap: 9px; padding: 15px 15px 13px; border-radius: 16px; background: rgba(0,232,122,0.10); border: 1px solid rgba(0,232,122,0.34); box-shadow: 0 0 34px -12px rgba(0,232,122,0.5);">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 7px; font-family: 'Space Grotesk', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: {{acento}};">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: {{acento}}; box-shadow: 0 0 0 4px rgba(0,232,122,0.22);"></span>
        AHORA
      </div>
      <div style="font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 600; color: #cfe9dc;">19:30 — 20:00</div>
    </div>

    <div style="font-size: 17px; font-weight: 700; line-height: 1.28; letter-spacing: -0.01em;">Didi — sesión corta de la noche</div>
    <div style="font-size: 12.5px; color: #a9c4b8; line-height: 1.45;">Hasta las 20:00, después de la ducha</div>

    <div style="display: flex; align-items: center; gap: 9px; margin-top: 2px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden;">
        <div style="width: 30%; height: 100%; border-radius: 99px; background: {{acento}};"></div>
      </div>
      <div style="font-family: 'Space Grotesk', monospace; font-size: 11px; font-weight: 600; color: {{acento}}; white-space: nowrap;">faltan 21 m</div>
    </div>

    <button type="button" style="margin-top: 4px; width: 100%; padding: 11px; border-radius: 11px; border: none; background: {{acento}}; color: #06231a; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;">Marcar hecho</button>
  </div>

  <!-- LO QUE VIENE: dos líneas por bloque, título completo, sin puntos suspensivos. -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 3px;">
    <div style="font-family: 'Space Grotesk', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #7f8aa0;">LO QUE VIENE</div>
    <div style="font-family: 'Space Grotesk', monospace; font-size: 10px; color: #7f8aa0;">7 bloques · 4 h 29 m</div>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden;">
    <sc-for list="{{proximos}}" as="b" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 46px 9px minmax(0, 1fr); gap: 11px; align-items: start; padding: 9px 8px; border-radius: 11px;">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-family: 'Space Grotesk', monospace; font-size: 12px; font-weight: 700; color: #d7dbe6; line-height: 1.1;">{{b.hora}}</div>
          <div style="font-family: 'Space Grotesk', monospace; font-size: 9.5px; color: #7f8aa0; line-height: 1.1;">{{b.dur}}</div>
        </div>
        <div style="width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; background: {{b.color}};"></div>
        <div style="font-size: 12.5px; font-weight: 500; color: #c9cedd; line-height: 1.38;">{{b.txt}}</div>
      </div>
    </sc-for>
    <div style="display: grid; grid-template-columns: 46px 9px minmax(0, 1fr); gap: 11px; align-items: center; padding: 9px 8px; border-radius: 11px; opacity: 0.6;">
      <div style="font-family: 'Space Grotesk', monospace; font-size: 12px; font-weight: 700; color: #8f96a8;">23:59</div>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#8f96a8" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>
      <div style="font-size: 12px; color: #8f96a8; line-height: 1.35;">Apagar pantallas y dormir</div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,0.09);">
    <a href="DireccionB.dc.html" style="flex-grow: 1; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #d7dbe6; font-size: 13px; font-weight: 600; text-align: center; text-decoration: none;">Ver el día completo</a>
    <a href="#coach" style="padding: 12px 17px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #9aa5b8; font-size: 13px; font-weight: 600; text-decoration: none;">Coach</a>
  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#00e87a","options":["#00e87a","#00e0c0","#5aa9ff","#ffd93d"]},"$preview":{"width":440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      acento: this.props.acento ?? '#00e87a',
      // El día real de Adán, del jueves 17 de septiembre.
      proximos: [
        { hora: '20:00', dur: '1h 15m', color: '#ffd93d', txt: 'Prioridad activa de Fase 0: negocio' },
        { hora: '21:15', dur: '30m',    color: '#ff6b6b', txt: 'Cena + preparar la comida de mañana' },
        { hora: '21:45', dur: '45m',    color: '#c8ccd8', txt: 'Cierre del día — lectura, diario y plan' },
        { hora: '22:30', dur: '30m',    color: '#ff6b6b', txt: 'Rutina de la noche — piel, minoxidil' },
        { hora: '23:00', dur: '10m',    color: '#c8ccd8', txt: 'Meditación — respiración box' },
        { hora: '23:30', dur: '29m',    color: '#2fe39c', txt: 'Construir esta aplicación' }
      ]
    };
  }
}
</script>
</body>
</html>
