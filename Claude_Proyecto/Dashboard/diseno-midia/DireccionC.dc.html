<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Día — Tres franjas plegables</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00e87a}a:hover{color:#5cffb4}
</style>
</helmet>

<div style="width: 440px; height: 920px; box-sizing: border-box; background: linear-gradient(162deg, #17393e 0%, #0f2b2f 42%, #0b2225 100%); border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 12px; color: #f4f4f8; overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; align-items: center; gap: 7px; font-family: 'Space Grotesk', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: {{acento}};">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: {{acento}};"></span>MI DÍA · JUE 17 SEP
      </div>
      <div style="font-family: 'Space Grotesk', monospace; font-size: 40px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em;">19:39</div>
    </div>
    <div style="text-align: right; display: flex; flex-direction: column; gap: 3px;">
      <div style="font-family: 'Space Grotesk', monospace; font-size: 17px; font-weight: 700; color: {{acento}};">8<span style="color: #7f8aa0; font-size: 12px;"> / 21</span></div>
      <div style="font-size: 10.5px; color: #9aa5b8;">quedan 4 h 50 m</div>
    </div>
  </div>

  <!-- Tres franjas. Las cerradas se resumen en una línea con su marcador de avance;
       solo la franja en curso está abierta, y es la única que gasta altura. -->
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; overflow: hidden;">

    <sc-for list="{{cerradas}}" as="f" hint-placeholder-count="2">
      <button type="button" style="display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035); color: inherit; font-family: 'Inter', sans-serif; text-align: left; cursor: pointer;">
        <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7f8aa0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"/></svg>
          <span style="font-size: 13px; font-weight: 700; color: #d7dbe6; flex-grow: 1;">{{f.nombre}}</span>
          <span style="font-family: 'Space Grotesk', monospace; font-size: 10.5px; color: #7f8aa0;">{{f.rango}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; width: 100%; padding-left: 22px;">
          <div style="display: flex; gap: 3px;">
            <sc-for list="{{f.puntos}}" as="p" hint-placeholder-count="6">
              <span style="width: 6px; height: 6px; border-radius: 50%; background: {{p.c}};"></span>
            </sc-for>
          </div>
          <span style="font-size: 11px; color: #8f98ab;">{{f.resumen}}</span>
        </div>
      </button>
    </sc-for>

    <!-- LA NOCHE: abierta, porque es la franja en la que está -->
    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 14px; border: 1px solid rgba(0,232,122,0.3); background: rgba(0,232,122,0.055); overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00e87a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"/></svg>
        <span style="font-size: 13px; font-weight: 700; color: #f4f4f8; flex-grow: 1;">Noche</span>
        <span style="font-family: 'Space Grotesk', monospace; font-size: 10.5px; color: {{acento}};">19:30 — 23:59 · 9</span>
      </div>

      <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; padding: 0 10px 11px; overflow: hidden;">
        <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 10px; border-radius: 11px; background: rgba(0,232,122,0.13); border: 1px solid rgba(0,232,122,0.36);">
          <div style="font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 700; color: {{acento}};">19:30</div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13px; font-weight: 700; line-height: 1.25;">Didi — sesión corta de la noche</div>
            <div style="font-family: 'Space Grotesk', monospace; font-size: 10.5px; color: {{acento}};">ahora · faltan 21 m</div>
          </div>
        </div>

        <sc-for list="{{noche}}" as="b" hint-placeholder-count="6">
          <div style="display: grid; grid-template-columns: 44px 8px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 8px 10px; border-radius: 10px;">
            <div style="font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 600; color: #a7aec0;">{{b.hora}}</div>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: {{b.color}};"></div>
            <div style="font-size: 12.5px; color: #c9cedd; line-height: 1.35;">{{b.txt}}</div>
            <div style="font-family: 'Space Grotesk', monospace; font-size: 10px; color: #7f8aa0;">{{b.dur}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,0.09);">
    <button type="button" style="flex-grow: 1; padding: 12px; border-radius: 12px; border: none; background: {{acento}}; color: #06231a; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;">Marcar el bloque actual</button>
    <a href="Main.dc.html" style="padding: 12px 17px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #9aa5b8; font-size: 13px; font-weight: 600; text-decoration: none;">Coach</a>
  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#00e87a","options":["#00e87a","#00e0c0","#5aa9ff","#ffd93d"]},"$preview":{"width":440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      acento: this.props.acento ?? '#00e87a',
      cerradas: [
        { nombre: 'Mañana', rango: '06:40 — 13:00', resumen: '6 bloques · 5 hechos',
          puntos: [{c:'#2fe39c'},{c:'#2fe39c'},{c:'#2fe39c'},{c:'rgba(255,255,255,0.22)'},{c:'#2fe39c'},{c:'#2fe39c'}] },
        { nombre: 'Tarde', rango: '13:00 — 19:30', resumen: '8 bloques · 3 hechos',
          puntos: [{c:'#2fe39c'},{c:'rgba(255,255,255,0.22)'},{c:'#2fe39c'},{c:'rgba(255,255,255,0.22)'},{c:'#2fe39c'},{c:'rgba(255,255,255,0.22)'},{c:'rgba(255,255,255,0.22)'},{c:'rgba(255,255,255,0.22)'}] }
      ],
      noche: [
        { hora: '20:00', color: '#ffd93d', dur: '1h 15m', txt: 'Prioridad activa de Fase 0: negocio' },
        { hora: '21:15', color: '#ff6b6b', dur: '30m',    txt: 'Cena + preparar la comida de mañana' },
        { hora: '21:45', color: '#c8ccd8', dur: '45m',    txt: 'Cierre del día — lectura y diario' },
        { hora: '22:30', color: '#ff6b6b', dur: '30m',    txt: 'Rutina de la noche — piel, minoxidil' },
        { hora: '23:00', color: '#c8ccd8', dur: '10m',    txt: 'Meditación — respiración box' },
        { hora: '23:10', color: '#c8ccd8', dur: '20m',    txt: 'Tiempo libre / relajación' },
        { hora: '23:30', color: '#2fe39c', dur: '29m',    txt: 'Construir esta aplicación' },
        { hora: '23:59', color: '#ff6b6b', dur: '—',      txt: 'Apagar pantallas y dormir' }
      ]
    };
  }
}
</script>
</body>
</html>
