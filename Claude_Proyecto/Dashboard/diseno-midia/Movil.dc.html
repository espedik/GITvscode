<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Día — en el teléfono</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00e87a}a:hover{color:#5cffb4}
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(162deg, #17393e 0%, #0f2b2f 42%, #0b2225 100%); padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 12px; color: #f4f4f8; overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 6px; font-family: 'Space Grotesk', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; color: {{acento}};">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: {{acento}};"></span>MI DÍA · JUE 17
      </div>
      <div style="font-family: 'Space Grotesk', monospace; font-size: 36px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em;">19:39</div>
    </div>
    <div style="text-align: right;">
      <div style="font-family: 'Space Grotesk', monospace; font-size: 16px; font-weight: 700; color: {{acento}};">8<span style="color: #7f8aa0; font-size: 11px;"> / 21</span></div>
      <div style="font-size: 10px; color: #9aa5b8;">quedan 4 h 50 m</div>
    </div>
  </div>

  <div style="height: 4px; border-radius: 99px; background: rgba(255,255,255,0.09); overflow: hidden;">
    <div style="width: 38%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, {{acento}}, #00e0c0);"></div>
  </div>

  <button type="button" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035); color: #9aa5b8; font-family: 'Inter', sans-serif; font-size: 11.5px; text-align: left; cursor: pointer;">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"/></svg>
    <span style="flex-grow: 1;"><b style="color: #d7dbe6;">14 bloques</b> antes de las 19:30</span>
  </button>

  <!-- En 390 px el bloque de ahora se lleva la pantalla: es lo único que se puede cambiar -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 15px; background: rgba(0,232,122,0.10); border: 1px solid rgba(0,232,122,0.34);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 6px; font-family: 'Space Grotesk', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; color: {{acento}};">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: {{acento}}; box-shadow: 0 0 0 4px rgba(0,232,122,0.22);"></span>AHORA
      </div>
      <div style="font-family: 'Space Grotesk', monospace; font-size: 11px; font-weight: 600; color: #cfe9dc;">19:30 — 20:00</div>
    </div>
    <div style="font-size: 16px; font-weight: 700; line-height: 1.28;">Didi — sesión corta de la noche</div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden;">
        <div style="width: 30%; height: 100%; border-radius: 99px; background: {{acento}};"></div>
      </div>
      <div style="font-family: 'Space Grotesk', monospace; font-size: 10.5px; font-weight: 600; color: {{acento}};">faltan 21 m</div>
    </div>
    <button type="button" style="width: 100%; padding: 13px; border-radius: 11px; border: none; background: {{acento}}; color: #06231a; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">Marcar hecho</button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px;">
    <div style="font-family: 'Space Grotesk', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; color: #7f8aa0;">LO QUE VIENE</div>
    <div style="font-family: 'Space Grotesk', monospace; font-size: 9.5px; color: #7f8aa0;">7 bloques</div>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; overflow: hidden;">
    <sc-for list="{{proximos}}" as="b" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 42px 8px minmax(0, 1fr); gap: 9px; align-items: start; padding: 8px 6px; border-radius: 10px;">
        <div>
          <div style="font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 700; color: #d7dbe6; line-height: 1.1;">{{b.hora}}</div>
          <div style="font-family: 'Space Grotesk', monospace; font-size: 9px; color: #7f8aa0; line-height: 1.2;">{{b.dur}}</div>
        </div>
        <div style="width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; background: {{b.color}};"></div>
        <div style="font-size: 12px; font-weight: 500; color: #c9cedd; line-height: 1.36;">{{b.txt}}</div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#00e87a","options":["#00e87a","#00e0c0","#5aa9ff","#ffd93d"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      acento: this.props.acento ?? '#00e87a',
      proximos: [
        { hora: '20:00', dur: '1h 15m', color: '#ffd93d', txt: 'Prioridad activa de Fase 0: negocio' },
        { hora: '21:15', dur: '30m',    color: '#ff6b6b', txt: 'Cena + preparar la comida de mañana' },
        { hora: '21:45', dur: '45m',    color: '#c8ccd8', txt: 'Cierre del día — lectura, diario y plan' },
        { hora: '22:30', dur: '30m',    color: '#ff6b6b', txt: 'Rutina de la noche — piel, minoxidil' },
        { hora: '23:00', dur: '10m',    color: '#c8ccd8', txt: 'Meditación — respiración box' },
        { hora: '23:30', dur: '29m',    color: '#2fe39c', txt: 'Construir esta aplicación' }
      ]
    };
  }
}
</script>
</body>
</html>
