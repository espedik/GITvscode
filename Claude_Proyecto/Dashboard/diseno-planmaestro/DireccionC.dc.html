<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plan Maestro · C</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047a6b}a:hover{color:#035c51}
</style>
</helmet>
<div style="width: 2048px; height: 1040px; box-sizing: border-box; padding: 26px 40px 30px; display: flex; flex-direction: column; gap: 14px; background: #f2f2f6; color: #16161a; font-family: Inter, -apple-system, sans-serif;">
  <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #5c5f70;">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #a8790a;"></span><span>Coach · Plan Maestro</span>
  </div>

  <button type="button" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; border-radius: 14px; background: #ffffff; border: 1px solid rgba(0,0,0,.12);">
    <span style="display: flex; align-items: baseline; gap: 12px;">
      <span style="font-family: 'Space Grotesk', monospace; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #047a6b;">FASE 1 DE 5</span>
      <b style="font-family: Fraunces, Georgia, serif; font-size: 22px;">Solicitud enviada y el ahorro en marcha</b>
      <span style="font-size: 13px; color: #5c5f70;">1 oct 2026 → 31 mar 2027 · día 21 de 182</span>
    </span>
    <span style="display: grid; grid-template-columns: 2fr 6fr 5fr 18fr 34fr; gap: 4px;">
      <span style="height: 8px; border-radius: 4px; background: #22c55e;"></span>
      <span style="height: 8px; border-radius: 4px; background: linear-gradient(90deg, #06b6d4 12%, rgba(6,182,212,.22) 12%);"></span>
      <span style="height: 8px; border-radius: 4px; background: rgba(245,158,11,.25);"></span>
      <span style="height: 8px; border-radius: 4px; background: rgba(236,72,153,.22);"></span>
      <span style="height: 8px; border-radius: 4px; background: rgba(139,92,246,.22);"></span>
    </span>
    <span style="display: flex; align-items: center; gap: 22px; font-size: 14px; color: #5c5f70;">
      <span><b style="color: #16161a;">Octubre:</b> 2 de 11 tareas</span>
      <span>Te toca: <b style="color: #16161a;">Deja la BBVA en cero quincena a quincena</b></span>
      <span>Se audita desde el 25</span>
      <span style="color: #c81e3a; font-weight: 600;">Septiembre sin auditar</span>
    </span>
  </button>

  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{medidores}}" as="k" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; background: #ffffff; border: 1px solid rgba(0,0,0,.12);">
        <span style="font-size: 12px; font-weight: 600; color: #5c5f70;">{{k.n}}</span>
        <span style="font-family: 'Space Grotesk', monospace; font-size: 20px; font-weight: 700; color: {{k.color}};">{{k.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; flex: 1;">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 15px; background: #ffffff; border: 1px solid rgba(0,0,0,.12);">
      <span style="font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 700;">Octubre 2026</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 36px; gap: 4px;">
        <sc-for list="{{celdas}}" as="d" hint-placeholder-count="35">
          <div style="visibility: {{d.vis}}; padding: 4px 7px; border-radius: 8px; background: {{d.fondo}}; border: 1px solid {{d.borde}}; font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 700; box-sizing: border-box;">{{d.n}}</div>
        </sc-for>
      </div>
    </div>
    <div style="padding: 14px 16px; border-radius: 15px; background: rgba(4,122,107,.04); border: 1px solid rgba(4,122,107,.32);">
      <span style="font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 700;">Miércoles 21</span>
    </div>
    <div style="padding: 14px 16px; border-radius: 15px; background: #ffffff; border: 1px solid rgba(0,0,0,.12);">
      <span style="font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 700;">Del 15 al 21 · cierras con $3,600</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2048,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const medidores = [['Fondo de emergencia', '$5,000', '#a8790a'], ['Deuda cara (BBVA)', '$9,500', '#c81e3a'], ['Fondo de la maestría', '$15,000', '#047a6b'],
      ['Patrimonio hacia $1M', '$250,000', '#00a758'], ['Intereses este mes', '$2,800', '#c81e3a'], ['Total invertido', '$12,000', '#047a6b'],
      ['Deuda total', '$300,000', '#c81e3a'], ['Camino a 2031', '1,900 días', '#7f4fb8']].map(k => ({ n: k[0], v: k[1], color: k[2] }));
    const celdas = [];
    for (let k = 0; k < 35; k++) { const n = k - 2, v = n < 1 || n > 31;
      celdas.push({ n: v ? '' : String(n), vis: v ? 'hidden' : 'visible', fondo: n === 21 ? 'rgba(4,122,107,.12)' : 'rgba(0,0,0,.04)', borde: n === 21 ? '#047a6b' : 'rgba(0,0,0,.08)' }); }
    return { medidores, celdas };
  }
}
</script>
</body>
</html>
