<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #05050a; font-family: 'Inter', -apple-system, sans-serif; }
    a { color: #00e0c0; } a:hover { color: #5df0dc; }
    .mono { font-family: 'Space Grotesk', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .lbl { font-family: 'Space Grotesk', monospace; font-size: 8px; font-weight: 700;
           letter-spacing: 0.18em; text-transform: uppercase; color: #6f7288; }
    .b { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
         justify-content: center; border: 1px solid rgba(255,255,255,0.07);
         background: rgba(255,255,255,0.025); color: #8589a8; }
    .b svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7;
             stroke-linecap: round; stroke-linejoin: round; }
    /* Ficha de pantalla: icono + nombre, en una sola columna. */
    .pf { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 9px; align-items: center;
          padding: 5px 8px; border-radius: 9px; border: 1px solid transparent; }
    .pf .ic { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
              justify-content: center; color: #8589a8; }
    .pf .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7;
                  stroke-linecap: round; stroke-linejoin: round; }
    .pf .t { font-size: 11px; color: #8589a8; white-space: nowrap; }
  </style>
</helmet>

<div style="width: 1100px; height: 720px; background:
     radial-gradient(600px 320px at 42% 40%, rgba(176,110,255,0.04), transparent 65%), #05050a;
     position: relative; overflow: hidden; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1)">

  <span style="position: absolute; top: 50%; left: 44%; transform: translate(-50%,-50%);
        font-size: 12px; color: #3a3d4e; letter-spacing: 0.2em">EL SLIDE GANA TODO ESTE LADO</span>

  <!-- ══ UN SOLO RAIL, a la derecha ══ -->
  <div style="position: absolute; right: 16px; top: 16px; bottom: 16px; width: 202px;
       display: flex; flex-direction: column; gap: 11px; padding: 15px 13px; border-radius: 18px;
       background: rgba(10,10,20,0.68); border: 1px solid rgba(255,255,255,0.08);
       backdrop-filter: blur(14px); box-sizing: border-box">

    <!-- estado -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span class="mono" style="font-size: 20px; font-weight: 700; color: #f4f4f8; line-height: 1">23:38</span>
      <span style="display: flex; align-items: center; gap: 5px">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: #f59e0b"></span>
        <span class="mono" style="font-size: 8.5px; color: #8589a8">sync 80m</span>
      </span>
    </div>

    <div style="height: 1px; background: rgba(255,255,255,0.09)"></div>

    <!-- pantallas -->
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-height: 0">
      <span class="lbl" style="padding: 0 8px 4px">Pantallas · 1 de 8</span>
      <div class="pf" style="background: rgba(0,232,122,0.11); border-color: rgba(0,232,122,0.32)">
        <span class="ic" style="color: #00e87a"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
        <span class="t" style="color: #f4f4f8; font-weight: 600">Mi Día</span>
      </div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5v9M9.8 9.8h4.4M9.8 14.2h4.4"></path></svg></span><span class="t">Coach</span></div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4"></circle></svg></span><span class="t">Metas</span></div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 4c0 5 10 6 10 11M17 4c0 5-10 6-10 11M7 20h10M7 4h10"></path></svg></span><span class="t">Habilidades base</span></div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.4"></circle><circle cx="17" cy="7" r="2.4"></circle><circle cx="12" cy="17" r="2.4"></circle><path d="M8.9 9.6l2.2 5M15.3 8.9l-2.3 6"></path></svg></span><span class="t">Habilidades</span></div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 5h2.2l2.3 10.5h9.6L19 8H6.2"></path><circle cx="9.5" cy="19" r="1.4"></circle><circle cx="16.5" cy="19" r="1.4"></circle></svg></span><span class="t">Lista de compras</span></div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path></svg></span><span class="t">Alemán</span></div>
      <div class="pf"><span class="ic"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"></rect><path d="M7.5 10l2.2 2.2-2.2 2.2M12 15h4.5"></path></svg></span><span class="t">Entrevistas</span></div>
    </div>

    <!-- reproducción -->
    <div style="display: flex; flex-direction: column; gap: 7px; padding-top: 10px;
         border-top: 1px solid rgba(255,255,255,0.09)">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 7px">
        <span class="b"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></span>
        <span class="b" style="flex-grow: 1; background: rgba(0,232,122,0.13);
              border-color: rgba(0,232,122,0.4); color: #00e87a; gap: 7px; width: auto">
          <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"></path></svg>
          <span class="mono" style="font-size: 9.5px; font-weight: 700">12 s</span></span>
        <span class="b"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></span>
      </div>
      <div style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden">
        <span style="display: block; width: 32%; height: 100%; border-radius: 2px; background: #00e87a"></span>
      </div>
    </div>

    <!-- sistema -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 5px;
         padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.09)">
      <span class="b"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8 2 2 0 1 1-2.7 2.7 1.6 1.6 0 0 0-1.8.3 1.6 1.6 0 0 0-1 1.5 2 2 0 1 1-4 0 1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3 2 2 0 1 1-2.7-2.7 1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1 2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8 2 2 0 1 1 2.7-2.7 1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5 2 2 0 1 1 4 0 1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3 2 2 0 1 1 2.7 2.7 1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1 2 2 0 1 1 0 4 1.6 1.6 0 0 0-1.5 1z"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.3a2.5 2.5 0 0 1 4.9.7c0 1.7-2.5 2.5-2.5 2.5"></path><path d="M12 17h.01"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"></path></svg></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
