<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #05050a; font-family: 'Inter', -apple-system, sans-serif; }
    a { color: #00e0c0; } a:hover { color: #5df0dc; }
    .mono { font-family: 'Space Grotesk', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .lbl { font-family: 'Space Grotesk', monospace; font-size: 8px; font-weight: 700;
           letter-spacing: 0.18em; text-transform: uppercase; color: #6f7288; }
    /* Botón del rail: cuadrado redondeado, no círculo — el icono cabe mejor y la columna
       se lee como una lista, no como una ristra de perlas. */
    .b { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center;
         justify-content: center; border: 1px solid rgba(255,255,255,0.07);
         background: rgba(255,255,255,0.025); color: #8589a8; }
    .b svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7;
             stroke-linecap: round; stroke-linejoin: round; }
    /* El activo NO se pinta encima del icono: se marca con un filete a la izquierda. */
    .b.on { background: rgba(0,232,122,0.13); border-color: rgba(0,232,122,0.4); color: #00e87a; }
    .nav-it { display: flex; align-items: center; gap: 9px; position: relative; }
    .nav-it .marca { position: absolute; left: -11px; width: 3px; height: 20px; border-radius: 2px;
                     background: #00e87a; box-shadow: 0 0 8px rgba(0,232,122,0.7); }
    .tip { font-size: 11px; font-weight: 600; color: #f4f4f8; white-space: nowrap; }
    .sep { height: 1px; background: rgba(255,255,255,0.09); margin: 3px 0; }
  </style>
</helmet>

<div style="width: 1100px; height: 720px; background:
     radial-gradient(600px 320px at 50% 40%, rgba(0,232,122,0.045), transparent 65%), #05050a;
     position: relative; overflow: hidden; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1)">

  <div style="position: absolute; inset: 0; opacity: 0.28;
       background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                         linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
       background-size: 40px 40px"></div>

  <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        font-size: 12px; color: #3a3d4e; letter-spacing: 0.2em">EL SLIDE VA AQUÍ</span>

  <!-- ══ RAIL IZQUIERDO · ir a una pantalla ══ -->
  <div style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
       display: flex; flex-direction: column; gap: 8px; padding: 14px 12px; border-radius: 18px;
       background: rgba(10,10,20,0.62); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px)">

    <span class="lbl" style="padding: 0 2px 2px">Pantallas</span>

    <div class="nav-it">
      <span class="marca"></span>
      <span class="b on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
      <span class="tip">Mi Día</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5v9M9.8 9.8h4.4M9.8 14.2h4.4"></path></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Coach</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Metas</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><path d="M7 4c0 5 10 6 10 11M17 4c0 5-10 6-10 11M7 20h10M7 4h10M8.5 8h7M8.5 16h7"></path></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Habilidades base</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.4"></circle><circle cx="17" cy="7" r="2.4"></circle><circle cx="12" cy="17" r="2.4"></circle><path d="M8.9 9.6l2.2 5M15.3 8.9l-2.3 6"></path></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Habilidades</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><path d="M3 5h2.2l2.3 10.5h9.6L19 8H6.2"></path><circle cx="9.5" cy="19" r="1.4"></circle><circle cx="16.5" cy="19" r="1.4"></circle></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Lista de compras</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Alemán</span>
    </div>
    <div class="nav-it">
      <span class="b"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"></rect><path d="M7.5 10l2.2 2.2-2.2 2.2M12 15h4.5"></path></svg></span>
      <span class="tip" style="color: #8589a8; font-weight: 500">Entrevistas</span>
    </div>
  </div>

  <!-- ══ RAIL DERECHO · estado, navegar, sistema ══ -->
  <div style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
       display: flex; flex-direction: column; gap: 10px; padding: 14px 12px; border-radius: 18px;
       background: rgba(10,10,20,0.62); border: 1px solid rgba(255,255,255,0.08);
       backdrop-filter: blur(14px); align-items: center; width: 118px; box-sizing: border-box">

    <!-- estado -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%">
      <span class="mono" style="font-size: 21px; font-weight: 700; color: #f4f4f8; line-height: 1">23:38</span>
      <span style="display: flex; align-items: center; gap: 5px">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: #f59e0b"></span>
        <span class="mono" style="font-size: 8.5px; color: #8589a8">sync 80 min</span>
      </span>
    </div>

    <div class="sep" style="width: 100%"></div>

    <!-- navegar -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%">
      <span class="lbl">Pantalla 1/8</span>
      <div style="display: flex; align-items: center; gap: 7px">
        <span class="b" style="width: 28px; height: 28px"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></span>
        <span class="b" style="width: 40px; height: 40px; background: rgba(0,232,122,0.13);
              border-color: rgba(0,232,122,0.4); color: #00e87a">
          <svg viewBox="0 0 24 24" style="width: 19px; height: 19px"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"></path></svg></span>
        <span class="b" style="width: 28px; height: 28px"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></span>
      </div>
      <!-- los puntos, como una regla de progreso -->
      <div style="display: flex; align-items: center; gap: 4px">
        <span style="width: 16px; height: 4px; border-radius: 2px; background: #00e87a; box-shadow: 0 0 7px rgba(0,232,122,0.6)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
        <span style="width: 5px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16)"></span>
      </div>
      <span class="mono" style="font-size: 8.5px; color: #6f7288">cambia en 12 s</span>
    </div>

    <div class="sep" style="width: 100%"></div>

    <!-- sistema -->
    <div style="display: grid; grid-template-columns: repeat(2, 34px); gap: 7px; justify-content: center">
      <span class="b"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg></span>
      <span class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.3a2.5 2.5 0 0 1 4.9.7c0 1.7-2.5 2.5-2.5 2.5"></path><path d="M12 17h.01"></path></svg></span>
      <span class="b" style="grid-column: span 2; width: 100%"><svg viewBox="0 0 24 24"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"></path></svg></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
