<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
  <style>
    :root{
      --bg:#04040c; --text:#f4f4f8; --text2:#9a9db3; --text3:#7d8199;
      --g:#00e87a; --o:#ff8a3d; --w:#ffd93d; --r:#ff5c5c; --cy:#00e0c0; --p:#b06eff;
      --g-rgb:0,232,122; --r-rgb:255,92,92; --w-rgb:255,217,61; --cy-rgb:0,224,192;
      --ov:255,255,255;
      --font:'Inter',-apple-system,sans-serif;
      --mono:'Space Grotesk',monospace;
      --font-title:'Fraunces',Georgia,serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
    a{color:var(--cy)} a:hover{color:var(--p)}
    .panel{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
      border:1px solid rgba(var(--cy-rgb),.16);
      clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
    .panel-hot{border-color:rgba(var(--r-rgb),.42);
      background:linear-gradient(160deg,rgba(var(--r-rgb),.14),rgba(var(--r-rgb),.05))}
    .k{font-family:var(--mono);font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      font-size:8px;color:var(--text3)}
    .num{font-family:var(--mono);font-weight:700;line-height:1}
    .p{width:6px;height:6px;border-radius:2px;flex-shrink:0}
  </style>
</helmet>

<div style="position:relative;width:390px;height:844px;background:#04040c;overflow:hidden">
  <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,224,192,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,224,192,.05) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 130% 60% at 50% 12%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 130% 60% at 50% 12%,#000 25%,transparent 78%)"></div>
    <div style="position:absolute;width:420px;height:360px;left:-130px;top:-150px;background:radial-gradient(ellipse at center,rgba(0,224,192,.2),transparent 68%);filter:blur(14px)"></div>
    <div style="position:absolute;width:400px;height:340px;right:-140px;bottom:-120px;background:radial-gradient(ellipse at center,rgba(176,110,255,.2),transparent 68%);filter:blur(14px)"></div>
    <div style="position:absolute;left:-30%;right:-30%;bottom:-34px;height:200px;transform:perspective(260px) rotateX(64deg);transform-origin:50% 100%;background-image:linear-gradient(rgba(0,224,192,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(0,224,192,.22) 1px,transparent 1px);background-size:44px 32px;-webkit-mask-image:linear-gradient(to top,#000,transparent 72%);mask-image:linear-gradient(to top,#000,transparent 72%);opacity:.7"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px)"></div>
  </div>

  <div style="position:relative;z-index:1;height:100%;padding:18px 15px;display:flex;flex-direction:column;gap:11px;overflow:hidden">

    <div style="flex-shrink:0">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);display:block"></span>
        <span class="k" style="color:var(--cy);font-size:8px">Hábitos · sep 2026</span>
      </div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
        <div style="font-family:var(--font-title);font-size:22px;font-weight:600;line-height:1.1">La cadena</div>
        <div style="display:flex;align-items:baseline;gap:2px;flex-shrink:0">
          <span class="num" style="font-size:26px;color:var(--w);text-shadow:0 0 16px rgba(var(--w-rgb),.55)">{{hoyHechos}}</span>
          <span class="num" style="font-size:13px;color:var(--text3)">/{{hoyTotal}}</span>
        </div>
      </div>
      <div style="height:4px;border-radius:2px;background:rgba(var(--ov),.09);margin-top:9px;overflow:hidden">
        <div style="height:100%;border-radius:2px;width:{{hoyPct}}%;background:linear-gradient(90deg,var(--g),var(--cy));box-shadow:0 0 10px rgba(var(--g-rgb),.55)"></div>
      </div>
    </div>

    <!-- Tres cifras en línea -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;flex-shrink:0">
      <div class="panel" style="padding:9px 10px">
        <div class="num" style="font-size:17px;color:var(--o)">{{rachaDias}}</div>
        <div class="k" style="margin-top:4px;font-size:7px">Racha</div>
      </div>
      <div class="panel" style="padding:9px 10px">
        <div class="num" style="font-size:17px;color:var(--cy)">{{mesPct}}%</div>
        <div class="k" style="margin-top:4px;font-size:7px">Mes</div>
      </div>
      <div class="panel" style="padding:9px 10px">
        <div class="num" style="font-size:17px;color:var(--p)">{{perfectos}}</div>
        <div class="k" style="margin-top:4px;font-size:7px">Redondos</div>
      </div>
    </div>

    <div class="panel panel-hot" style="padding:10px 13px;flex-shrink:0;display:flex;align-items:center;gap:9px">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--r)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><path d="M12 3.5 22 20H2L12 3.5Z"></path><path d="M12 10v4.5M12 17.3v.2"></path></svg>
      <div style="font-size:11px;line-height:1.4;color:var(--text2)"><b style="color:var(--text)">Meditar</b> falló ayer. No lo falles dos veces.</div>
    </div>

    <!-- Lo de hoy, con la tira del mes bajo cada nombre -->
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:hidden">
      <sc-for list="{{deHoy}}" as="t" hint-placeholder-count="11">
        <div onClick="{{t.tog}}" style="display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:11px;background:{{t.bg}};border:1px solid {{t.br}};cursor:pointer;flex-shrink:0">
          <div style="width:26px;height:26px;border-radius:8px;flex-shrink:0;background:{{t.boxBg}};border:1.5px solid {{t.boxBr}};display:flex;align-items:center;justify-content:center">
            <sc-if value="{{t.hecho}}" hint-placeholder-val="{{true}}">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#04040c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"></path></svg>
            </sc-if>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;color:{{t.txt}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.nombre}}</div>
            <div style="display:flex;gap:1.5px;margin-top:5px">
              <sc-for list="{{t.puntos}}" as="p" hint-placeholder-count="30">
                <div class="p" style="background:{{p.bg}}"></div>
              </sc-for>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="{{t.rachaCol}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.7 3 2.6 4.2 4 5.8A7.5 7.5 0 0 1 12 21a7.5 7.5 0 0 1-4-13.2C9.3 9 10 10 10 11c1.4-1.6 2-5 2-8Z"></path></svg>
            <span class="num" style="font-size:11px;color:{{t.rachaCol}}">{{t.racha}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.HOY = 11; this.DIAS = 30; this.DOW0 = 2;
    this.base = [
      { id:'gym',   nombre:'Gimnasio',          dow:[1,2,4,5], fallos:[] },
      { id:'pasos', nombre:'8 000 pasos',       dow:'todos',   fallos:[6,9] },
      { id:'ale',   nombre:'Alemán · 15 min',   dow:'todos',   fallos:[6] },
      { id:'genai', nombre:'CT-GenAI · 30 min', dow:[1,2,3,4,5], fallos:[8] },
      { id:'leer',  nombre:'Leer 10 páginas',   dow:'todos',   fallos:[3,7] },
      { id:'medi',  nombre:'Meditar · 5 min',   dow:'todos',   fallos:[5,10] },
      { id:'sueno', nombre:'Dormir 7 h',        dow:'todos',   fallos:[2,6,9] },
      { id:'azucar',nombre:'Sin azúcar',        dow:'todos',   fallos:[6,7] },
      { id:'gasto', nombre:'Anotar gastos',     dow:'todos',   fallos:[2,8] },
      { id:'agua',  nombre:'3 litros de agua',  dow:'todos',   fallos:[9] },
      { id:'piel',  nombre:'Skincare noche',    dow:'todos',   fallos:[4] }
    ];
    this.state = { hechos: { ale:true, leer:true, gasto:true, agua:true, pasos:true, piel:true, genai:true } };
  }
  dow(d) { return (this.DOW0 + d - 1) % 7; }
  toca(h, d) { return h.dow === 'todos' || h.dow.indexOf(this.dow(d)) >= 0; }
  estado(h, d) {
    if (!this.toca(h, d)) return 'off';
    if (d > this.HOY) return 'fut';
    if (d === this.HOY) return this.state.hechos[h.id] ? 'hoyok' : 'hoy';
    return h.fallos.indexOf(d) >= 0 ? 'no' : 'ok';
  }
  racha(h) {
    let n = 0;
    for (let d = this.HOY; d >= 1; d--) {
      const e = this.estado(h, d);
      if (e === 'off') continue;
      if (e === 'ok' || e === 'hoyok') n++;
      else if (e === 'hoy') continue;
      else break;
    }
    return n;
  }
  toggle(id) {
    const h = Object.assign({}, this.state.hechos);
    h[id] = !h[id];
    this.setState({ hechos: h });
  }
  renderVals() {
    const self = this;
    const COL = { ok:'#00e87a', hoyok:'#00e87a', no:'rgba(255,92,92,.5)',
                  off:'rgba(255,255,255,.05)', fut:'rgba(255,255,255,.07)',
                  hoy:'rgba(255,217,61,.6)' };

    let cumplidas = 0, tocadas = 0, mejor = 0;
    this.base.forEach(function (h) {
      for (let d = 1; d <= self.DIAS; d++) {
        const e = self.estado(h, d);
        if (e !== 'off' && e !== 'fut' && e !== 'hoy') { tocadas++; if (e === 'ok' || e === 'hoyok') cumplidas++; }
      }
      const r = self.racha(h);
      if (r > mejor) mejor = r;
    });

    const deHoy = this.base.filter(function (h) { return self.toca(h, self.HOY); })
      .map(function (h) {
        const hecho = !!self.state.hechos[h.id];
        const r = self.racha(h);
        const puntos = [];
        for (let d = 1; d <= self.DIAS; d++) puntos.push({ bg: COL[self.estado(h, d)] });
        return {
          nombre: h.nombre, hecho: hecho, puntos: puntos, racha: r,
          rachaCol: r >= 7 ? '#00e87a' : (r >= 3 ? '#ffd93d' : '#7d8199'),
          bg: hecho ? 'rgba(0,232,122,.1)' : 'rgba(255,255,255,.035)',
          br: hecho ? 'rgba(0,232,122,.32)' : 'rgba(255,255,255,.09)',
          boxBg: hecho ? '#00e87a' : 'rgba(255,255,255,.04)',
          boxBr: hecho ? '#00e87a' : 'rgba(255,255,255,.22)',
          txt: hecho ? '#f4f4f8' : '#9a9db3',
          tog: function () { self.toggle(h.id); }
        };
      });

    const hoyHechos = deHoy.filter(function (t) { return t.hecho; }).length;

    let perfectos = 0;
    for (let d = 1; d < this.HOY; d++) {
      let todo = true, alguno = false;
      for (let i = 0; i < this.base.length; i++) {
        const e = this.estado(this.base[i], d);
        if (e === 'off') continue;
        alguno = true;
        if (e !== 'ok') todo = false;
      }
      if (alguno && todo) perfectos++;
    }

    return {
      deHoy: deHoy, hoyHechos: hoyHechos, hoyTotal: deHoy.length,
      hoyPct: deHoy.length ? Math.round(hoyHechos / deHoy.length * 100) : 0,
      rachaDias: mejor,
      mesPct: tocadas ? Math.round(cumplidas / tocadas * 100) : 0,
      perfectos: perfectos
    };
  }
}
</script>
</body>
</html>
