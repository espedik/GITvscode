      ],
      tablas: [
        { lbl: 'La tabla completa', cab: ['', 'masculino', 'femenino', 'neutro', 'plural'], de: [1, 2, 3, 4], colores: ['', '#3b82f6', '#ec4899', '#10b981', '#f97316'], filas: [
          ['Nominativ', 'frisch[er] Kaffee', 'kalt[e] Milch', 'kalt[es] Wasser', 'neu[e] Kollegen'],

        { t: 'Anuncios de trabajo y de depas', ej: [['Wir bieten flexibl[e] Arbeitszeiten und gut[es] Gehalt.', 'Ofrecemos horario flexible y buen sueldo.'], ['Hell[e] Zweizimmerwohnung mit groß[em] Balkon', 'Depa luminoso de dos cuartos con balcón grande']] }

      ojo: [['Ich trinke kalte Kaffee.', 'Ich trinke kalten Kaffee.', 'Akkusativ masculino sin artículo: **-en** (como den).'], ['mit kaltem Milch', 'mit kalter Milch', 'die Milch → Dativ der → **-er**.'],

    { k: 'comparar', t: 'Comparar', sub: 'größer als · am größten', c: '#059669', alias: ['komparativ', 'superlativ'],

        { t: 'a, o, u se vuelven ä, ö, ü', d: 'En casi todos los adjetivos cortos: alt → älter, groß → größer, jung → jünger, kurz → kürzer, lang → länger, warm → wärmer, kalt → kälter, arm → ärmer, stark → stärker. Sin diéresis: klar, toll, voll, froh, laut, bunt.', ej: [['Im Winter ist es [kälter] als im Herbst.', 'En invierno hace más frío que en otoño.']] },

    { k: 'especiales', t: 'Usos especiales', sub: 'etwas Neues · der Deutsche', c: '#0e7490', alias: ['nominalisierung'],

        { t: 'etwas, nichts, viel, wenig + mayúscula y -es', d: 'Después de **alles**, en cambio, **-e**: alles Gute.', ej: [['Gibt es [etwas Neues]?', '¿Hay algo nuevo?'], ['Ich habe [nichts Besonderes] gemacht.', 'No hice nada especial.'], ['Ich wünsche dir [alles Gute]!', '¡Te deseo lo mejor!']] },
        { t: 'El adjetivo como sustantivo', d: 'Se escribe con mayúscula y **se declina como adjetivo**: der Deutsch**e**, ein Deutsch**er**, die Erwachsen**en**.', ej: [['Mein Kollege ist [ein Deutscher], seine Frau ist [eine Deutsche].', 'Mi colega es alemán; su esposa es alemana.'], ['Die [Erwachsenen] zahlen 10 Euro.', 'Los adultos pagan 10 euros.'], ['Er ist [ein Bekannter] von mir.', 'Es un conocido mío.']],
